aws:
  account_id: ''
  bucket_name: ''
  region: us-east-1
  role_arn: ''
codebuild:
  inference_project: groot-n16-inference-build
  training_project: groot-n16-training-build
dataset:
  s3_prefix: datasets/leisaac-pick-orange
ecr:
  inference_uri: ''
  training_uri: ''
inference:
  endpoint_name: groot-n16-endpoint
  instance_type: ml.g5.2xlarge
  model_package_group: groot-n16-models
model:
  hf_model_id: nvidia/GR00T-N1.6-3B
  s3_prefix: models/groot-n16
  groot_version: n1.6
training:
  global_batch_size: 32
  instance_type: ml.g5.2xlarge
  max_steps: 100
  save_steps: 50
  max_wait_seconds: 86400
  num_gpus: 1
  use_spot: true
