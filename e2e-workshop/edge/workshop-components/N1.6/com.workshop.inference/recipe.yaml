---
RecipeFormatVersion: "2020-01-25"
ComponentName: com.workshop.inference
ComponentVersion: "1.0.0"
ComponentDescription: "GR00T N1.6 Pick-Orange Policy Server (PyTorch 또는 TRT)"
ComponentPublisher: Custom
ComponentDependencies:
  com.workshop.setup:
    VersionRequirement: ">=1.0.0"
    DependencyType: HARD
ComponentConfiguration:
  DefaultConfiguration:
    ecrImage: "ECR_REPO_PLACEHOLDER:latest"
    # Default = fine-tuned Pick-Orange (Module 6 / edge). Module 2 overrides modelPath
    # to the base SO-101 dir built by prepare-base-so101.sh (untrained baseline).
    modelPath: "/opt/groot/models/GR00T-N1.6-3B-Pick-Orange"
    embodimentTag: "NEW_EMBODIMENT"
    policyHost: "0.0.0.0"
    policyPort: "5555"
    # The models host path is mounted 1:1 so a modelPath under it (e.g. the base
    # SO-101 dir with relative symlinks to base weights) resolves in the container.
    modelsHostPath: "/home/ubuntu/environment/models"
Manifests:
  - Platform:
      os: linux
      architecture: amd64
    Lifecycle:
      run:
        RequiresPrivilege: true
        Script: |
          set -e
          ECR_IMAGE="{configuration:/ecrImage}"
          MODEL_PATH="{configuration:/modelPath}"
          EMBODIMENT="{configuration:/embodimentTag}"
          POLICY_HOST="{configuration:/policyHost}"
          POLICY_PORT="{configuration:/policyPort}"
          MODELS_HOST="{configuration:/modelsHostPath}"

          # Mount the models host path 1:1 (if present) so a modelPath under it
          # resolves in the container (used by the Module 2 base SO-101 symlink dir).
          MODELS_MOUNT=""
          if [ -n "$MODELS_HOST" ] && [ -d "$MODELS_HOST" ]; then
            MODELS_MOUNT="-v $MODELS_HOST:$MODELS_HOST"
          fi

          docker stop groot-workshop-inference 2>/dev/null || true
          docker rm groot-workshop-inference 2>/dev/null || true

          echo "=== GR00T N1.6 Policy Server ==="
          echo "Model: $MODEL_PATH"
          echo "Embodiment: $EMBODIMENT"
          echo "Listen: $POLICY_HOST:$POLICY_PORT"

          docker run -d --gpus all --network=host --entrypoint /bin/bash \
            --name groot-workshop-inference \
            --shm-size=8g \
            --restart unless-stopped \
            -e PYTHONUNBUFFERED=1 \
            -v /opt/groot/models:/opt/groot/models \
            -v /opt/groot/trt_n16:/opt/groot/trt_n16 \
            -v /home/ubuntu/.cache/huggingface:/root/.cache/huggingface \
            $MODELS_MOUNT \
            "$ECR_IMAGE" \
            -c "cd /workspace/gr00t-repo && python -m gr00t.eval.run_gr00t_server \
              --model-path $MODEL_PATH \
              --embodiment-tag $EMBODIMENT \
              --host $POLICY_HOST \
              --port $POLICY_PORT"

          echo "Waiting for Policy Server (up to 15 min)..."
          for i in $(seq 1 180); do
            ss -tlnp | grep -q ":$POLICY_PORT " && echo "✅ Policy Server ready on port $POLICY_PORT" && break
            sleep 5
          done

          if ! ss -tlnp | grep -q ":$POLICY_PORT "; then
            echo "⚠️ Timeout waiting for port $POLICY_PORT — check: docker logs groot-workshop-inference"
          fi

          # Keep script alive so Greengrass doesn't trigger shutdown
          docker wait groot-workshop-inference
      shutdown:
        RequiresPrivilege: true
        Script: |
          docker stop groot-workshop-inference 2>/dev/null || true
          docker rm groot-workshop-inference 2>/dev/null || true
        Timeout: 30
