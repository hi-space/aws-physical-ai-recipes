---
RecipeFormatVersion: "2020-01-25"
ComponentName: com.workshop.docker-build
ComponentVersion: "1.0.0"
ComponentDescription: "GR00T N1.6 Docker 이미지 ECR Pull (이미 있으면 스킵)"
ComponentPublisher: Custom
ComponentConfiguration:
  DefaultConfiguration:
    ecrRepo: "ECR_REPO_PLACEHOLDER"
    imageTag: "latest"
    region: "us-east-1"
Manifests:
  - Platform:
      os: linux
      architecture: amd64
    Lifecycle:
      run:
        RequiresPrivilege: true
        Script: |
          set -e
          ECR_REPO="{configuration:/ecrRepo}"
          IMAGE_TAG="{configuration:/imageTag}"
          REGION="{configuration:/region}"
          FULL_IMAGE="${ECR_REPO}:${IMAGE_TAG}"
          ACCOUNT_ID=$(echo "$ECR_REPO" | cut -d. -f1)
          LOCAL_TAG="$(basename "$ECR_REPO"):${IMAGE_TAG}"

          if docker images --format '{{.Repository}}:{{.Tag}}' | grep -q "^${LOCAL_TAG}$"; then
            echo "Docker image already exists ($LOCAL_TAG), skipping"
            exit 0
          fi

          echo "=== ECR Login & Pull ==="
          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          docker pull "$FULL_IMAGE"
          docker tag "$FULL_IMAGE" "$LOCAL_TAG"
          echo "=== Pull 완료 ($LOCAL_TAG) ==="
        Timeout: 3600
