aws:
  account_id: ''
  alias: ''
  bucket_name: ''
  region: us-east-1
  role_arn: ''
codebuild:
  training_project: groot-sm-training-build
dataset:
  s3_prefix: datasets/leisaac-pick-orange
  hf_dataset_id: LightwheelAI/leisaac-pick-orange
ecr:
  training_uri: ''
eval:
  instance_type: ml.g5.2xlarge
model:
  hf_model_id: nvidia/GR00T-N1.6-3B
  s3_prefix: models/groot-sm
  groot_version: n1.6
  package_group_name: groot-sm-models
training:
  global_batch_size: 32
  instance_type: ml.g5.12xlarge
  max_steps: 100
  save_steps: 50
  max_wait_seconds: 86400
  use_spot: false
  # run_with_fallback.py: 용량 부족 시 이 순서로 on-demand 재시도 (primary 다음).
  # 예: [ml.g6e.12xlarge, ml.g6.12xlarge] — 해당 training job usage 쿼터가 있는 계정만.
  instance_fallbacks: []
  # Pending(용량 대기)이 이 시간(초)을 넘으면 Job 중단하고 다음 후보로 폴백.
  capacity_timeout_seconds: 900
transform:
  instance_type: ml.m5.2xlarge
