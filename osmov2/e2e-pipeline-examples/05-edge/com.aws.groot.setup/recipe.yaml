---
# Stage 5 — Edge (setup component)
# AWS IoT Greengrass component that stages the fine-tuned GR00T model onto an
# edge device. Generalized from e2e-workshop/edge/workshop-components/N1.6/
# com.workshop.setup — the workshop hardcoded a CloudFront tarball; here the
# model comes from the S3 location you export the Stage 3 (03-vla-finetune) OSMO
# dataset to (see 05-edge/README.md).
#
# TensorRT engine build is optional (buildTrt=false by default) so the base
# component works without the workshop-specific export scripts.
RecipeFormatVersion: "2020-01-25"
ComponentName: com.aws.groot.setup
ComponentVersion: "1.0.1"
ComponentDescription: "Stage the fine-tuned GR00T policy model on an edge device (from S3)."
ComponentPublisher: AWS-Physical-AI-Recipes
ComponentConfiguration:
  DefaultConfiguration:
    # s3://<bucket>/<prefix> where you uploaded the Stage 3 checkpoint.
    modelS3Uri: "s3://REPLACE_ME/models/e2e-pipeline-groot-checkpoint"
    modelDir: "/opt/groot/models"
    modelName: "GR00T-checkpoint"
    region: "ap-northeast-2"
    buildTrt: "false"
    trtEngineDir: "/opt/groot/trt"
    precision: "bf16"
Manifests:
  - Platform:
      os: linux
      architecture: amd64
    Lifecycle:
      run:
        RequiresPrivilege: true
        Script: |
          set -e
          export AWS_DEFAULT_REGION="{configuration:/region}"
          MODEL_S3_URI="{configuration:/modelS3Uri}"
          MODEL_DIR="{configuration:/modelDir}"
          MODEL_NAME="{configuration:/modelName}"
          BUILD_TRT="{configuration:/buildTrt}"

          DEST="${MODEL_DIR}/${MODEL_NAME}"

          # Guard: refuse to run against an unconfigured source. With --delete
          # below, syncing from an empty/placeholder URI would wipe $DEST, so we
          # fail fast instead. Set modelS3Uri in the recipe or override it in the
          # deployment (register-components.sh --model-s3-uri ...).
          case "$MODEL_S3_URI" in
            ""|s3://|s3://REPLACE_ME/*)
              echo "ERROR: modelS3Uri is not configured ('$MODEL_S3_URI')."
              echo "  Set it in com.aws.groot.setup/recipe.yaml, or pass"
              echo "  --model-s3-uri s3://<bucket>/<prefix> to register-components.sh."
              exit 1 ;;
          esac

          # Guard: the source must actually contain objects — otherwise --delete
          # would empty a previously-good model directory.
          if [ -z "$(aws s3 ls "${MODEL_S3_URI%/}/" --region "$AWS_DEFAULT_REGION" 2>/dev/null)" ]; then
            echo "ERROR: no objects found under ${MODEL_S3_URI} — aborting without"
            echo "  touching $DEST (check the URI / device role S3 permissions)."
            exit 1
          fi

          # If the model source changed since last time, clear the destination
          # first so the new model is an EXACT copy. aws s3 sync compares size +
          # mtime (not content), so a different model whose metadata files (e.g.
          # config.json / tokenizer) happen to match size with an older S3 mtime
          # could be skipped and leave STALE files from the previous model. A
          # clean copy on URI change avoids that silent mismatch. A same-URI
          # redeploy skips the clear and stays incremental (cheap); overwritten
          # objects get a newer mtime so sync still refreshes them.
          PREV_URI=""
          [ -f "$DEST/.source-uri" ] && PREV_URI="$(cat "$DEST/.source-uri" 2>/dev/null || true)"
          mkdir -p "$DEST"
          if [ -n "$PREV_URI" ] && [ "$PREV_URI" != "$MODEL_S3_URI" ]; then
            echo "Model source changed:"
            echo "  from $PREV_URI"
            echo "  to   $MODEL_S3_URI"
            echo "Clearing $DEST for a clean copy."
            find "$DEST" -mindepth 1 -delete 2>/dev/null || true
          fi

          # Always mirror-sync so a CHANGED model (new Stage 3 checkpoint, or a
          # different modelS3Uri) fully REPLACES the one already on the device —
          # this is what makes "change the model and redeploy" work. aws s3 sync
          # is incremental (unchanged files are not re-downloaded) and --delete
          # removes stale files from a previous model, so repeated deployments
          # are cheap and the local dir exactly matches S3.
          echo "=== Syncing model from ${MODEL_S3_URI} -> ${DEST} ==="
          aws s3 sync "$MODEL_S3_URI" "$DEST" --region "$AWS_DEFAULT_REGION" --no-progress --delete
          echo "$MODEL_S3_URI" > "$DEST/.source-uri"
          echo "Model ready: $DEST ($(du -sh "$DEST" | cut -f1))"

          if [ "$BUILD_TRT" = "true" ]; then
            echo "buildTrt=true set, but TRT export is model-specific."
            echo "Provide export_onnx + build_tensorrt scripts for your checkpoint,"
            echo "or run inference in PyTorch mode (default)."
          fi

          echo "=== Setup complete ==="
        Timeout: 3600
