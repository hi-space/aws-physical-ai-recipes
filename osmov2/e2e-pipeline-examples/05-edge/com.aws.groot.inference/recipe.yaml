---
# Stage 5 — Edge (inference component)
# AWS IoT Greengrass component that runs the GR00T ZMQ policy server on an edge
# device using the model staged by com.aws.groot.setup. Same ZMQ REQ/REP
# protocol (run_gr00t_server.py) the closed-loop eval and robot clients speak.
#
# Generalized from e2e-workshop/edge/workshop-components/N1.6/
# com.workshop.inference — parameterized ECR image and model path instead of
# hardcoded workshop values.
RecipeFormatVersion: "2020-01-25"
ComponentName: com.aws.groot.inference
ComponentVersion: "1.0.1"
ComponentDescription: "GR00T policy server (ZMQ) on the edge device."
ComponentPublisher: AWS-Physical-AI-Recipes
ComponentDependencies:
  com.aws.groot.setup:
    VersionRequirement: ">=1.0.0"
    DependencyType: HARD
ComponentConfiguration:
  DefaultConfiguration:
    # ECR image containing the Isaac-GR00T repo + deps (gr00t.eval.run_gr00t_server).
    ecrImage: "REPLACE_ME.dkr.ecr.ap-northeast-2.amazonaws.com/groot-inference:latest"
    modelPath: "/opt/groot/models/GR00T-checkpoint"
    embodimentTag: "NEW_EMBODIMENT"
    policyHost: "0.0.0.0"
    policyPort: "5555"
Manifests:
  - Platform:
      os: linux
      architecture: amd64
    Lifecycle:
      run:
        RequiresPrivilege: true
        Script: |
          set -e
          ECR_IMAGE="{configuration:/ecrImage}"
          MODEL_PATH="{configuration:/modelPath}"
          EMBODIMENT="{configuration:/embodimentTag}"
          POLICY_HOST="{configuration:/policyHost}"
          POLICY_PORT="{configuration:/policyPort}"

          docker stop groot-edge-inference 2>/dev/null || true
          docker rm groot-edge-inference 2>/dev/null || true

          # --- Authenticate to ECR and pull the image ------------------------
          # The image lives in a PRIVATE ECR repo. Greengrass runs this script
          # with the device (TES) role, to which bootstrap-device.sh granted ECR
          # pull permissions (same credential path setup's `aws s3 sync` uses).
          # We must log the docker daemon in ourselves — Greengrass does not do
          # it for a raw `docker run`. Then pull explicitly so a newly pushed
          # tag (e.g. :latest) is picked up on redeploy instead of a stale local
          # image. Non-ECR images (e.g. Docker Hub) skip the login.
          REGISTRY="${ECR_IMAGE%%/*}"
          if echo "$REGISTRY" | grep -q '\.dkr\.ecr\..*\.amazonaws\.com'; then
            ECR_REGION=$(echo "$REGISTRY" | sed -E 's/.*\.dkr\.ecr\.([^.]+)\.amazonaws\.com.*/\1/')
            ECR_REGION="${ECR_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}"
            echo "ECR login: $REGISTRY (region=$ECR_REGION)"
            aws ecr get-login-password --region "$ECR_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"
            echo "Pulling $ECR_IMAGE ..."
            docker pull "$ECR_IMAGE"
          else
            echo "Image $ECR_IMAGE is not an ECR URI — skipping ECR login."
          fi

          echo "=== GR00T Policy Server (edge) ==="
          echo "Model: $MODEL_PATH  Embodiment: $EMBODIMENT  Listen: $POLICY_HOST:$POLICY_PORT"

          docker run -d --gpus all --network=host --entrypoint /bin/bash \
            --name groot-edge-inference \
            --shm-size=8g \
            --restart unless-stopped \
            -e PYTHONUNBUFFERED=1 \
            -v /opt/groot/models:/opt/groot/models \
            "$ECR_IMAGE" \
            -c "cd /workspace/gr00t-repo && python -m gr00t.eval.run_gr00t_server \
              --model-path $MODEL_PATH \
              --embodiment-tag $EMBODIMENT \
              --host $POLICY_HOST \
              --port $POLICY_PORT"

          echo "Waiting for policy server (up to 15 min)..."
          for i in $(seq 1 180); do
            ss -tlnp | grep -q ":$POLICY_PORT " && echo "Policy server ready on $POLICY_PORT" && break
            sleep 5
          done
          if ! ss -tlnp | grep -q ":$POLICY_PORT "; then
            echo "Timeout waiting for port $POLICY_PORT — check: docker logs groot-edge-inference"
          fi

          # Keep the lifecycle script alive so Greengrass doesn't tear it down.
          docker wait groot-edge-inference
      shutdown:
        RequiresPrivilege: true
        Script: |
          docker stop groot-edge-inference 2>/dev/null || true
          docker rm groot-edge-inference 2>/dev/null || true
        Timeout: 30
