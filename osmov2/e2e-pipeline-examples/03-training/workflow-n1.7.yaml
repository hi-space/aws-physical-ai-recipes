# Stage 3 — Training (GR00T N1.7 VLA fine-tune)
# N1.7 variant of 03-training. The workshop's main fine-tuning module
# (e2e-workshop/infra/groot) targets GR00T N1.7 via the experiment.run() API in
# finetune_gr00t.py — NOT launch_finetune.py (which is the N1.6 path used by the
# default workflow.yaml). N1.7 uses the Cosmos-Reason2-2B VLM backbone, a HF
# gated repo, so HF_TOKEN must have access to nvidia/Cosmos-Reason2-2B.
#
# Use the default workflow.yaml for N1.6 (easier to reproduce, no gated backbone).
# Use this file to match the workshop's original N1.7 training intent.
#
#   osmo workflow submit examples ... 03-training/workflow-n1.7.yaml \
#     --set input_dataset=e2e-pipeline-lerobot-dataset \
#     --set max_steps=6000
#
# Note: the N1.7 checkpoint produced here needs an N1.7-compatible server/policy
# client in Stage 4 (04-closeloop), which currently pins the N1.6 gr00t_ref and
# --policy_type gr00tn1.6. Override Stage 4 accordingly before chaining N1.7.

workflow:
  name: aws-e2e-training-n17
  timeout:
    exec_timeout: 12h
    queue_timeout: 6h
  resources:
    gpu:
      cpu: {{ cpu }}
      gpu: 1
      memory: {{ memory }}
      storage: {{ storage }}
      platform: {{ platform }}

  tasks:
  - name: gr00t-finetune
    resource: gpu
    image: {{ image_name }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    credentials:
      huggingface_token:
        HF_TOKEN: token
    inputs:
    - dataset:
        name: {{ input_dataset }}
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail
        START_TS="$(date -u +%s)"

        unset PIP_CONSTRAINT || true
        export PIP_CONSTRAINT=
        export DEBIAN_FRONTEND=noninteractive
        export HF_HOME=/tmp/hf-home
        export HUGGING_FACE_HUB_TOKEN="${HF_TOKEN:-}"
        export PYTHONUNBUFFERED=1
        export UV_LINK_MODE=copy
        export UV_PROJECT_ENVIRONMENT=/tmp/gr00t-venv
        export WANDB_DISABLED=true

        # Push HF Trainer scalars (loss/lr/epoch/grad_norm) to the in-cluster
        # Prometheus Pushgateway so they land in Grafana alongside DCGM GPU
        # metrics. Best-effort: if pushgateway_url is empty (no in-cluster
        # observability), push_metrics.py just tees stdout and pushes nothing.
        # The workflow id is a label so a Grafana panel can filter per run.
        PUSHGATEWAY_URL="{{ pushgateway_url }}"
        METRICS_JOB="groot_training"
        WORKFLOW_ID="${HOSTNAME}"

        BASE_MODEL_PATH="{{ base_model_path }}"
        GROOT_VERSION="{{ groot_version }}"
        EMBODIMENT_TAG="{{ embodiment_tag }}"
        MAX_STEPS="{{ max_steps }}"
        SAVE_STEPS="{{ save_steps }}"
        SAVE_TOTAL_LIMIT="{{ save_total_limit }}"
        GLOBAL_BATCH_SIZE="{{ global_batch_size }}"
        LEARNING_RATE="{{ learning_rate }}"
        DATALOADER_NUM_WORKERS="{{ dataloader_num_workers }}"
        RETAIN_MODEL_WEIGHTS="{{ retain_model_weights }}"
        ARTIFACT_DIR="{{output}}/artifacts"
        OUTPUT_DIR=/tmp/gr00t-output
        DATASET_DIR="{{input:0}}/dataset"

        nvidia-smi
        python --version

        if [ -z "${HF_TOKEN:-}" ]; then
          echo "ERROR: N1.7 needs HF_TOKEN with access to the gated nvidia/Cosmos-Reason2-2B backbone." >&2
          exit 1
        fi

        apt-get update >/dev/null
        apt-get install -y --no-install-recommends \
          ca-certificates curl ffmpeg git git-lfs libgl1 libglib2.0-0 >/dev/null
        git lfs install --skip-repo >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
        export PATH="${HOME}/.local/bin:${PATH}"

        # Stage 1 output layout is <input>/dataset, but OSMO may nest the
        # published dataset under <input>/<dataset-name>/artifacts/dataset. Locate
        # the LeRobot root by finding the meta/info.json it must contain.
        if [ ! -d "${DATASET_DIR}/meta" ]; then
          INFO_JSON="$(find "{{input:0}}" -maxdepth 6 -type f -path '*/meta/info.json' 2>/dev/null | sort | head -1)"
          if [ -n "${INFO_JSON}" ]; then
            DATASET_DIR="$(dirname "$(dirname "${INFO_JSON}")")"
          else
            DATASET_DIR="{{input:0}}"
          fi
        fi
        test -d "${DATASET_DIR}/meta"
        echo ">>> Using dataset at ${DATASET_DIR}"

        # Copy the dataset to a writable dir — finetune_gr00t.py patches parquet
        # files and meta/modality.json in place (OSMO input mounts are read-only).
        DATASET_LOCAL_DIR=/tmp/dataset
        mkdir -p "${DATASET_LOCAL_DIR}"
        cp -a "${DATASET_DIR}/." "${DATASET_LOCAL_DIR}/"

        git clone --filter=blob:none "{{ gr00t_repository }}" /tmp/Isaac-GR00T
        cd /tmp/Isaac-GR00T
        git checkout "{{ gr00t_ref }}"
        uv sync --no-dev

        # SO-101 modality config registered for NEW_EMBODIMENT (from e2e workshop).
        # Code body is identical to the N1.6 config; N1.7 loads it via
        # register_modality_config() the same way.
        cp /tmp/so101_modality_config.py /tmp/so101_e2e_config.py

        # GPU metrics sampler
        GPU_METRICS_DIR=/tmp/gpu-metrics
        mkdir -p "${GPU_METRICS_DIR}"
        (
          set +e
          while true; do
            nvidia-smi \
              --query-gpu=timestamp,index,name,utilization.gpu,utilization.memory,memory.used,memory.total,power.draw,temperature.gpu \
              --format=csv,noheader,nounits >>"${GPU_METRICS_DIR}/nvidia-smi.csv" 2>/dev/null || true
            sleep "{{ gpu_metrics_interval_seconds }}"
          done
        ) &
        GPU_METRICS_PID="$!"
        trap 'kill "${GPU_METRICS_PID}" 2>/dev/null || true' EXIT

        # N1.7 trains via finetune_gr00t.py (experiment.run API), not
        # launch_finetune.py. The script reads all config from env vars, patches
        # the dataset (modality.json annotation key + parquet task_description
        # column + stats.json), builds a FinetuneConfig, and runs training. This
        # matches e2e-workshop/infra/groot/assets/finetune_gr00t.py; the OSMO
        # single-pod variant drops the EFS/S3/HF-upload and multi-node Batch
        # plumbing from run_finetune_workflow.sh (not needed for one pod).
        export DATASET_LOCAL_DIR OUTPUT_DIR BASE_MODEL_PATH GROOT_VERSION
        export EMBODIMENT_TAG MAX_STEPS SAVE_STEPS GLOBAL_BATCH_SIZE LEARNING_RATE
        export DATALOADER_NUM_WORKERS SAVE_TOTAL_LIMIT
        export NUM_GPUS=1
        export MODALITY_CONFIG_PATH=/tmp/so101_e2e_config.py
        export REPORT_TO=tensorboard
        export PYTHONPATH="/tmp/Isaac-GR00T:${PYTHONPATH:-}"

        # Pipe training stdout through the metrics pusher (tee keeps the original
        # stream visible in `osmo workflow logs`). set -o pipefail is already on,
        # so finetune_gr00t.py's exit status still propagates.
        uv run python /tmp/finetune_gr00t.py 2>&1 \
          | PUSHGATEWAY_URL="${PUSHGATEWAY_URL}" METRICS_JOB="${METRICS_JOB}" \
            WORKFLOW_ID="${WORKFLOW_ID}" python3 -u /tmp/push_metrics.py

        kill "${GPU_METRICS_PID}" 2>/dev/null || true
        python /tmp/gpu_metrics_summary.py "${GPU_METRICS_DIR}/nvidia-smi.csv" "${GPU_METRICS_DIR}" || true

        if [ "${RETAIN_MODEL_WEIGHTS}" != "true" ]; then
          find "${OUTPUT_DIR}" -type f \( \
            -name "optimizer.pt" -o -name "scheduler.pt" -o -name "rng_state.pth" \
          \) -delete
        fi

        mkdir -p "${ARTIFACT_DIR}"
        cp -a "${OUTPUT_DIR}/." "${ARTIFACT_DIR}/"
        cp -a "${GPU_METRICS_DIR}" "${ARTIFACT_DIR}/gpu-metrics"
        END_TS="$(date -u +%s)"
        cat > "${ARTIFACT_DIR}/run-manifest.json" <<JSON
        {
          "workflow": "aws-e2e-training-n17",
          "base_model_path": "${BASE_MODEL_PATH}",
          "groot_version": "${GROOT_VERSION}",
          "embodiment_tag": "${EMBODIMENT_TAG}",
          "modality_config": "so101_e2e_config.py",
          "training_api": "finetune_gr00t.py:experiment.run",
          "use_relative_action": "hardcoded-true-in-finetune-script",
          "max_steps": ${MAX_STEPS},
          "global_batch_size": ${GLOBAL_BATCH_SIZE},
          "runtime_seconds": $((END_TS - START_TS)),
          "retain_model_weights": "${RETAIN_MODEL_WEIGHTS}"
        }
        JSON

        find "${ARTIFACT_DIR}" -maxdepth 3 -type f | sort | head -200
        exit 0
    - path: /tmp/push_metrics.py
      contents: |
        # Read HF Trainer stdout on stdin, echo it back unchanged (so the OSMO
        # workflow log is preserved), and push loss/lr/epoch/grad_norm scalars to
        # a Prometheus Pushgateway. Uses only the stdlib so it runs under the
        # system python3 without touching the training venv. No-op (pure tee) if
        # PUSHGATEWAY_URL is empty; every push is wrapped so metrics can never
        # break training.
        import ast
        import os
        import re
        import sys
        import urllib.request

        PGW = os.environ.get("PUSHGATEWAY_URL", "").rstrip("/")
        JOB = os.environ.get("METRICS_JOB", "groot_training")
        WF = os.environ.get("WORKFLOW_ID", "unknown")
        LOSS_RE = re.compile(r"(\{[^{}]*'loss'[^{}]*\})")

        def push(step, d):
            if not PGW:
                return
            lines = []
            for key, metric in (
                ("loss", "groot_train_loss"),
                ("learning_rate", "groot_learning_rate"),
                ("epoch", "groot_epoch"),
                ("grad_norm", "groot_grad_norm"),
            ):
                if key in d:
                    try:
                        lines.append("{} {}".format(metric, float(d[key])))
                    except (TypeError, ValueError):
                        pass
            lines.append("groot_global_step {}".format(step))
            body = ("\n".join(lines) + "\n").encode()
            url = "{}/metrics/job/{}/workflow/{}".format(PGW, JOB, WF)
            try:
                req = urllib.request.Request(url, data=body, method="POST")
                urllib.request.urlopen(req, timeout=5).read()
            except Exception as exc:  # noqa: BLE001 - metrics must never break training
                sys.stderr.write("push_metrics: {}\n".format(exc))

        step = 0
        for line in sys.stdin:
            sys.stdout.write(line)
            sys.stdout.flush()
            m = LOSS_RE.search(line)
            if not m:
                continue
            try:
                d = ast.literal_eval(m.group(1))
            except (ValueError, SyntaxError):
                continue
            if "loss" not in d:
                continue
            step += 1
            push(step, d)
    - path: /tmp/finetune_gr00t.py
      contents: |
        #!/usr/bin/env python3
        """GR00T N1.7 fine-tune (OSMO single-pod port of e2e-workshop's
        infra/groot/assets/finetune_gr00t.py). Reads config from env vars,
        patches the dataset for N1.7 (modality.json annotation key + parquet
        task_description column + stats.json), builds a FinetuneConfig, and runs
        training via experiment.run(). The upstream EFS/S3/HF-upload and
        multi-node Batch orchestration are intentionally omitted — OSMO handles
        dataset I/O and this runs on a single pod / single GPU.
        """
        import importlib.util
        import json
        import logging
        import os
        import subprocess
        import sys
        from pathlib import Path

        import pyarrow as pa
        import pyarrow.parquet as pq
        import torch

        from gr00t.configs.base_config import get_default_config
        from gr00t.configs.finetune_config import FinetuneConfig
        from gr00t.experiment.experiment import run

        logging.basicConfig(
            level=logging.INFO,
            format="%(asctime)s - %(levelname)s - %(message)s",
            handlers=[logging.StreamHandler(sys.stdout)],
        )
        logger = logging.getLogger(__name__)

        DATASET_LOCAL_DIR = os.environ["DATASET_LOCAL_DIR"]
        OUTPUT_DIR = os.getenv("OUTPUT_DIR", "/tmp/gr00t-output")
        BASE_MODEL_PATH = os.getenv("BASE_MODEL_PATH", "nvidia/GR00T-N1.7-3B")
        GROOT_VERSION = os.getenv("GROOT_VERSION", "n1.7").lower()
        EMBODIMENT_TAG = os.getenv("EMBODIMENT_TAG", "new_embodiment")
        MODALITY_CONFIG_PATH = os.getenv("MODALITY_CONFIG_PATH", "/tmp/so101_e2e_config.py")
        MAX_STEPS = int(os.getenv("MAX_STEPS", "6000"))
        SAVE_STEPS = int(os.getenv("SAVE_STEPS", "2000"))
        SAVE_TOTAL_LIMIT = int(os.getenv("SAVE_TOTAL_LIMIT", "1"))
        GLOBAL_BATCH_SIZE = int(os.getenv("GLOBAL_BATCH_SIZE", "32"))
        LEARNING_RATE = float(os.getenv("LEARNING_RATE", "1e-4"))
        WEIGHT_DECAY = float(os.getenv("WEIGHT_DECAY", "1e-5"))
        WARMUP_RATIO = float(os.getenv("WARMUP_RATIO", "0.05"))
        GRADIENT_ACCUMULATION_STEPS = int(os.getenv("GRADIENT_ACCUMULATION_STEPS", "1"))
        DATALOADER_NUM_WORKERS = int(os.getenv("DATALOADER_NUM_WORKERS", "4"))
        NUM_GPUS = int(os.getenv("NUM_GPUS", "1"))

        ANNOTATION_KEY = "human.task_description"
        ANNOTATION_COL = "annotation.human.task_description"


        def patch_dataset():
            meta_dir = os.path.join(DATASET_LOCAL_DIR, "meta")
            modality_json = os.path.join(meta_dir, "modality.json")
            os.makedirs(meta_dir, exist_ok=True)
            if not os.path.isfile(modality_json):
                content = {
                    "state": {"single_arm": {"start": 0, "end": 5}, "gripper": {"start": 5, "end": 6}},
                    "action": {"single_arm": {"start": 0, "end": 5}, "gripper": {"start": 5, "end": 6}},
                    "video": {
                        "wrist": {"original_key": "observation.images.wrist"},
                        "front": {"original_key": "observation.images.front"},
                    },
                    "annotation": {ANNOTATION_KEY: {"original_key": "task_index"}},
                }
                with open(modality_json, "w") as f:
                    json.dump(content, f, indent=4)
                logger.info("Created modality.json at %s", modality_json)
            else:
                with open(modality_json) as f:
                    content = json.load(f)
                if ANNOTATION_KEY not in content.get("annotation", {}):
                    content.setdefault("annotation", {})[ANNOTATION_KEY] = {"original_key": "task_index"}
                    with open(modality_json, "w") as f:
                        json.dump(content, f, indent=4)
                    logger.info("Patched modality.json annotation.%s", ANNOTATION_KEY)

            data_dir = os.path.join(DATASET_LOCAL_DIR, "data")
            if not os.path.isdir(data_dir):
                data_dir = DATASET_LOCAL_DIR
            for pf in Path(data_dir).rglob("*.parquet"):
                try:
                    table = pq.read_table(str(pf))
                    if ANNOTATION_COL not in table.column_names:
                        if "task_index" in table.column_names:
                            task_col = table.column("task_index")
                            str_col = pa.array([str(v.as_py()) for v in task_col], type=pa.string())
                            table = table.append_column(ANNOTATION_COL, str_col)
                            pq.write_table(table, str(pf))
                            logger.info("Patched %s: added %s", pf.name, ANNOTATION_COL)
                        else:
                            logger.warning("%s: no task_index column to copy from", pf.name)
                except Exception as exc:
                    logger.warning("Could not patch %s: %s", pf, exc)

            stats_path = os.path.join(meta_dir, "stats.json")
            if not os.path.isfile(stats_path):
                logger.info("Generating dataset stats.json...")
                result = subprocess.run(
                    [sys.executable, "-m", "gr00t.data.stats", DATASET_LOCAL_DIR],
                    capture_output=True, text=True,
                )
                if result.returncode != 0:
                    logger.warning("stats generation failed: %s", result.stderr)
                else:
                    logger.info("Generated stats.json")


        def load_modality_config():
            if not os.path.isfile(MODALITY_CONFIG_PATH):
                raise FileNotFoundError(MODALITY_CONFIG_PATH)
            spec = importlib.util.spec_from_file_location("modality_config", MODALITY_CONFIG_PATH)
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)
            logger.info("Loaded modality config from %s", MODALITY_CONFIG_PATH)


        def main():
            os.makedirs(OUTPUT_DIR, exist_ok=True)
            available = torch.cuda.device_count() if torch.cuda.is_available() else 1
            assert 0 < NUM_GPUS <= available, f"NUM_GPUS={NUM_GPUS} > available={available}"
            os.environ["CUDA_VISIBLE_DEVICES"] = "0"

            patch_dataset()
            load_modality_config()

            ft = FinetuneConfig(
                base_model_path=BASE_MODEL_PATH,
                dataset_path=DATASET_LOCAL_DIR,
                output_dir=OUTPUT_DIR,
                embodiment_tag=EMBODIMENT_TAG,
                modality_config_path=MODALITY_CONFIG_PATH,
                global_batch_size=GLOBAL_BATCH_SIZE,
                max_steps=MAX_STEPS,
                save_steps=SAVE_STEPS,
                num_gpus=NUM_GPUS,
                learning_rate=LEARNING_RATE,
                weight_decay=WEIGHT_DECAY,
                warmup_ratio=WARMUP_RATIO,
                gradient_accumulation_steps=GRADIENT_ACCUMULATION_STEPS,
                dataloader_num_workers=DATALOADER_NUM_WORKERS,
                tune_llm=False,
                tune_visual=False,
                tune_projector=True,
                tune_diffusion_model=True,
                use_wandb=False,
            )
            embodiment_tag = (
                ft.embodiment_tag.lower() if isinstance(ft.embodiment_tag, str) else ft.embodiment_tag.value
            )

            config = get_default_config().load_dict(
                {
                    "data": {
                        "download_cache": False,
                        "datasets": [
                            {"dataset_paths": [ft.dataset_path], "mix_ratio": 1.0, "embodiment_tag": embodiment_tag}
                        ],
                    }
                }
            )
            config.load_config_path = None

            config.model.tune_llm = ft.tune_llm
            config.model.tune_visual = ft.tune_visual
            config.model.tune_projector = ft.tune_projector
            config.model.tune_diffusion_model = ft.tune_diffusion_model
            config.model.state_dropout_prob = ft.state_dropout_prob
            config.model.random_rotation_angle = ft.random_rotation_angle
            config.model.color_jitter_params = ft.color_jitter_params
            config.model.load_bf16 = False
            config.model.reproject_vision = False
            # N1.6 uses the Eagle backbone (needs eagle_collator=True + model_name
            # override); N1.7 uses Cosmos-Reason2-2B — leave its defaults alone.
            if GROOT_VERSION == "n1.6":
                config.model.eagle_collator = True
                config.model.model_name = "nvidia/Eagle-Block2A-2B-v2"
            config.model.backbone_trainable_params_fp32 = True
            config.model.use_relative_action = True

            config.training.start_from_checkpoint = ft.base_model_path
            config.training.optim = "adamw_torch"
            config.training.global_batch_size = ft.global_batch_size
            config.training.dataloader_num_workers = ft.dataloader_num_workers
            config.training.learning_rate = ft.learning_rate
            config.training.gradient_accumulation_steps = ft.gradient_accumulation_steps
            config.training.output_dir = ft.output_dir
            config.training.save_steps = ft.save_steps
            config.training.save_total_limit = SAVE_TOTAL_LIMIT
            config.training.num_gpus = ft.num_gpus
            config.training.use_wandb = ft.use_wandb
            config.training.max_steps = ft.max_steps
            config.training.weight_decay = ft.weight_decay
            config.training.warmup_ratio = ft.warmup_ratio
            config.training.wandb_project = os.getenv("WANDB_PROJECT", "finetune-gr00t-n1d7")

            config.data.shard_size = ft.shard_size
            config.data.episode_sampling_rate = ft.episode_sampling_rate
            config.data.num_shards_per_epoch = ft.num_shards_per_epoch

            logger.info("Starting GR00T %s fine-tuning...", GROOT_VERSION)
            run(config)
            logger.info("Training completed successfully")


        if __name__ == "__main__":
            main()
    - path: /tmp/so101_modality_config.py
      contents: |
        """SO-ARM101 (6-DOF) modality config — from e2e-workshop.

        Copy of e2e-workshop/infra/groot/assets/so101_modality_config.py (the N1.7
        training asset). Code body is identical to the N1.6 data config; registers
        a NEW_EMBODIMENT config with 5 arm joints + 1 gripper matching the
        LightwheelAI/leisaac-pick-orange dataset and the LeIsaac closed-loop eval
        language key `annotation.human.task_description`.
        """
        from gr00t.configs.data.embodiment_configs import register_modality_config
        from gr00t.data.embodiment_tags import EmbodimentTag
        from gr00t.data.types import (
            ActionConfig,
            ActionFormat,
            ActionRepresentation,
            ActionType,
            ModalityConfig,
        )

        so101_config = {
            "video": ModalityConfig(
                delta_indices=[0],
                modality_keys=["front", "wrist"],
            ),
            "state": ModalityConfig(
                delta_indices=[0],
                modality_keys=["single_arm", "gripper"],
            ),
            "action": ModalityConfig(
                delta_indices=list(range(0, 16)),
                modality_keys=["single_arm", "gripper"],
                action_configs=[
                    ActionConfig(
                        rep=ActionRepresentation.RELATIVE,
                        type=ActionType.NON_EEF,
                        format=ActionFormat.DEFAULT,
                    ),
                    ActionConfig(
                        rep=ActionRepresentation.ABSOLUTE,
                        type=ActionType.NON_EEF,
                        format=ActionFormat.DEFAULT,
                    ),
                ],
            ),
            "language": ModalityConfig(
                delta_indices=[0],
                modality_keys=["annotation.human.task_description"],
            ),
        }

        register_modality_config(so101_config, embodiment_tag=EmbodimentTag.NEW_EMBODIMENT)
    - path: /tmp/gpu_metrics_summary.py
      contents: |
        import csv
        import json
        import math
        import statistics
        import sys
        from pathlib import Path

        csv_path = Path(sys.argv[1])
        out_dir = Path(sys.argv[2])
        out_dir.mkdir(parents=True, exist_ok=True)

        fields = ["timestamp", "index", "name", "gpu_util_percent", "memory_util_percent",
                  "memory_used_mib", "memory_total_mib", "power_draw_w", "temperature_c"]
        rows = []
        if csv_path.exists():
            with csv_path.open(newline="") as f:
                for row in csv.reader(f):
                    if len(row) != len(fields):
                        continue
                    item = {k: v.strip() for k, v in zip(fields, row)}
                    for k in fields[3:]:
                        try:
                            item[k] = float(item[k])
                        except ValueError:
                            item[k] = math.nan
                    rows.append(item)

        def values(key):
            return [float(r[key]) for r in rows if not math.isnan(float(r[key]))]

        summary = {
            "sample_count": len(rows),
            "gpu_name": rows[0]["name"] if rows else None,
            "gpu_util_percent_avg": statistics.fmean(values("gpu_util_percent")) if values("gpu_util_percent") else None,
            "gpu_util_percent_max": max(values("gpu_util_percent")) if values("gpu_util_percent") else None,
            "memory_used_mib_max": max(values("memory_used_mib")) if values("memory_used_mib") else None,
            "power_draw_w_max": max(values("power_draw_w")) if values("power_draw_w") else None,
        }
        (out_dir / "gpu-metrics-summary.json").write_text(json.dumps(summary, indent=2) + "\n")

        try:
            import matplotlib
            matplotlib.use("Agg")
            import matplotlib.pyplot as plt
            x = list(range(len(rows)))
            fig, ax = plt.subplots(2, 1, figsize=(12, 6), sharex=True)
            ax[0].plot(x, values("gpu_util_percent"), label="GPU util %", color="#2563eb")
            ax[0].set_ylabel("percent"); ax[0].legend(); ax[0].grid(True, alpha=0.3)
            mem = [v / 1024 for v in values("memory_used_mib")]
            ax[1].plot(x, mem, label="Memory used GiB", color="#9333ea")
            ax[1].set_xlabel("sample"); ax[1].set_ylabel("GiB"); ax[1].legend(); ax[1].grid(True, alpha=0.3)
            fig.suptitle("GR00T N1.7 fine-tune GPU utilization"); fig.tight_layout()
            fig.savefig(out_dir / "gpu-utilization.png", dpi=150)
        except Exception as exc:
            (out_dir / "gpu-metrics-plot-error.txt").write_text(str(exc) + "\n")
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  cpu: 16
  memory: 96Gi
  storage: 256Gi
  # g6e-l40s (48GB VRAM) is the default fallback. N1.7 uses the larger gated
  # Cosmos-Reason2-2B backbone, so 48GB may OOM at larger batch sizes; keep
  # global_batch_size small on g6e, or override --set platform=g7e-rtx-pro-6000
  # for the 96GB g7e.8xlarge card.
  platform: g6e-l40s
  image_name: "nvcr.io/nvidia/pytorch:25.03-py3"
  gr00t_repository: "https://github.com/NVIDIA/Isaac-GR00T"
  gr00t_ref: "23ace64f17aa5015259b8609d371eb61a357c776"
  base_model_path: nvidia/GR00T-N1.7-3B
  groot_version: n1.7
  embodiment_tag: NEW_EMBODIMENT
  input_dataset: e2e-pipeline-lerobot-dataset
  output_dataset: e2e-pipeline-groot-checkpoint-n17
  max_steps: 10
  save_steps: 10
  save_total_limit: 1
  global_batch_size: 1
  learning_rate: 1e-4
  dataloader_num_workers: 4
  retain_model_weights: "true"
  gpu_metrics_interval_seconds: 10
  # In-cluster Pushgateway (scripts/deploy-observability*.sh). HF Trainer
  # loss/lr/epoch/grad_norm are pushed here so they show in the same Grafana as
  # DCGM GPU metrics. Empty string disables the push (pure stdout tee).
  pushgateway_url: "http://aws-osmo-pushgateway-prometheus-pushgateway.monitoring.svc.cluster.local:9091"
