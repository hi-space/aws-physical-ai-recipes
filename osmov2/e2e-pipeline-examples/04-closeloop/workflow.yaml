# Stage 4 — Closed-Loop Sim Eval (LeIsaac + SO-101)
# Faithful OSMO port of e2e-workshop/groot/inference/run-isaaclab.sh: inside the
# Isaac Lab container, install LeIsaac + LeRobot, download the SO-101
# kitchen_with_orange scene, start the GR00T ZMQ policy server in the
# background, then run LeIsaac's policy_inference.py so the SO-101 arm follows
# "pick up the orange" in closed loop.
#
# Note: leisaac's policy_inference.py sets env_cfg.recorders=None and wraps no
# gym.wrappers.RecordVideo, so it emits no mp4. The success/fail signal comes
# from the rollout log, not from video artifacts.
#
# Consumes the Stage 3 fine-tuned checkpoint as an input dataset.
#
#   osmo workflow submit examples ... 04-closeloop/workflow.yaml \
#     --set input_dataset=e2e-pipeline-groot-checkpoint

workflow:
  name: aws-e2e-closeloop
  timeout:
    exec_timeout: 4h
    queue_timeout: 1h
  resources:
    gpu:
      cpu: {{ cpu }}
      gpu: 1
      memory: {{ memory }}
      storage: {{ storage }}
      platform: {{ platform }}

  tasks:
  - name: eval
    resource: gpu
    image: {{ isaac_lab_image }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    inputs:
    - dataset:
        name: {{ input_dataset }}
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail

        export ACCEPT_EULA=Y
        export PRIVACY_CONSENT=Y
        export DEBIAN_FRONTEND=noninteractive
        export PYTHONUNBUFFERED=1

        LEISAAC_REPO="{{ leisaac_repository }}"
        LEISAAC_COMMIT="{{ leisaac_ref }}"
        EMBODIMENT_TAG="{{ embodiment_tag }}"
        TASK_NAME="{{ task_name }}"
        INSTRUCTION="{{ instruction }}"
        NUM_EPISODES="{{ num_episodes }}"
        STEP_HZ="{{ step_hz }}"
        POLICY_HOST="127.0.0.1"
        POLICY_PORT="{{ policy_port }}"
        ARTIFACT_DIR="{{output}}/artifacts"

        PKGS_DIR=/tmp/isaaclab-pkgs
        ASSETS_DIR=/tmp/leisaac-assets
        SCRIPTS_DIR=/tmp/leisaac-repo

        # Fine-tuned checkpoint from Stage 3 (03-vla-finetune). OSMO nests the
        # published dataset (e.g. <input>/<dataset-name>/artifacts/checkpoint-N),
        # so locate the HF model dir by finding the config.json it must contain.
        # Prefer the highest-numbered checkpoint-* dir when several exist.
        MODEL_PATH="{{input:0}}"
        if [ ! -f "${MODEL_PATH}/config.json" ]; then
          CANDIDATE="$(find "${MODEL_PATH}" -maxdepth 6 -name config.json -printf '%h\n' 2>/dev/null \
            | grep -E '/checkpoint-[0-9]+$' | sort -t- -k2 -n | tail -1)"
          if [ -z "${CANDIDATE}" ]; then
            CANDIDATE="$(find "${MODEL_PATH}" -maxdepth 6 -name config.json -printf '%h\n' 2>/dev/null | sort | tail -1)"
          fi
          if [ -n "${CANDIDATE}" ]; then
            MODEL_PATH="${CANDIDATE}"
          fi
        fi
        echo ">>> Using model checkpoint at ${MODEL_PATH}"
        test -f "${MODEL_PATH}/config.json"

        nvidia-smi
        mkdir -p "${ARTIFACT_DIR}/logs" "${ARTIFACT_DIR}/videos" "${PKGS_DIR}" \
          "${ASSETS_DIR}/scenes" "${ASSETS_DIR}/robots"

        apt-get update >/dev/null
        apt-get install -y --no-install-recommends \
          ca-certificates curl git git-lfs libgl1 libglib2.0-0 ffmpeg unzip >/dev/null
        git lfs install --skip-repo >/dev/null

        # ── Step 1: Install leisaac + lerobot into a target dir (run-isaaclab.sh Step 1)
        echo ">>> Installing leisaac[gr00t] + lerobot..."
        # Pin torch==2.7.0 / torchvision==0.22.0 up front: lerobot accepts it
        # (<2.11,>=2.2.1) and gr00t (Isaac-GR00T) hard-pins torch==2.7.0, so
        # pinning here keeps a single torch and lets the flash-attn prebuilt
        # wheel below match. ninja/packaging are flash-attn build tooling.
        /workspace/isaaclab/_isaac_sim/python.sh -m pip install \
          --target "${PKGS_DIR}" \
          torch==2.7.0 torchvision==0.22.0 \
          lerobot zmq msgpack-python ninja packaging \
          "leisaac[gr00t] @ git+${LEISAAC_REPO}.git@${LEISAAC_COMMIT}#subdirectory=source/leisaac"
        export PYTHONPATH="${PKGS_DIR}:${PYTHONPATH:-}"

        # ── Step 1a: Patch leisaac for GR00T N1.6 dynamic language key ─────
        # Use Isaac Sim's bundled python: the isaac-lab runtime image has no
        # system `python3` (only /workspace/isaaclab/_isaac_sim/python.sh), so
        # `python3 ...` fails with command-not-found. No `|| true` here — a
        # silently-skipped patch leaves a latent client/serialization bug.
        /workspace/isaaclab/_isaac_sim/python.sh /tmp/patch_leisaac.py \
          "${PKGS_DIR}/leisaac/policy/service_policy_clients.py" \
          "${PKGS_DIR}/leisaac/policy/gr00t/serialization.py"

        # ── Step 2: Download SO-101 scene assets (run-isaaclab.sh Step 2) ──
        echo ">>> Downloading kitchen_with_orange scene + so101_follower.usd..."
        curl -fsSL -o /tmp/kitchen_with_orange.zip \
          "${LEISAAC_REPO}/releases/download/v0.1.0/kitchen_with_orange.zip"
        unzip -o /tmp/kitchen_with_orange.zip -d "${ASSETS_DIR}/scenes/" >/dev/null
        rm -f /tmp/kitchen_with_orange.zip
        curl -fsSL -o "${ASSETS_DIR}/robots/so101_follower.usd" \
          "${LEISAAC_REPO}/releases/download/v0.1.0/so101_follower.usd"
        export LEISAAC_ASSETS_ROOT="${ASSETS_DIR}"

        # ── Step 3: Clone leisaac eval scripts (run-isaaclab.sh Step 3) ────
        git clone "${LEISAAC_REPO}.git" "${SCRIPTS_DIR}"
        (cd "${SCRIPTS_DIR}" && git checkout "${LEISAAC_COMMIT}")

        # ── Step 4: Patch policy_inference.py for headless keyboard support
        # + disable wait_for_textures (see patch_headless.py). Bundled python
        # only (no system python3); no `|| true` — an unpatched reset() hangs
        # forever waiting on a texture-load event that never fires headless.
        /workspace/isaaclab/_isaac_sim/python.sh /tmp/patch_headless.py \
          "${SCRIPTS_DIR}/scripts/evaluation/policy_inference.py"

        # ── Step 5: IsaacSim cache dirs ────────────────────────────────────
        mkdir -p ~/docker/isaac-sim/cache/{kit,ov,pip,glcache,computecache}
        mkdir -p ~/docker/isaac-sim/{logs,data,documents}

        # ── Start GR00T ZMQ policy server in background ────────────────────
        echo ">>> Cloning Isaac-GR00T for run_gr00t_server.py..."
        git clone --filter=blob:none "{{ gr00t_repository }}" /tmp/Isaac-GR00T
        (cd /tmp/Isaac-GR00T && git checkout "{{ gr00t_ref }}")

        # Isaac-GR00T (gr00t==0.1.0) hard-pins flash-attn==2.7.4.post1. Its
        # setup.py compiles from source (needs nvcc/CUDA_HOME) even to generate
        # metadata, and the isaac-lab runtime image has no CUDA toolkit. So
        # fetch the matching prebuilt wheel into a local find-links dir. The
        # wheel tag depends on the installed torch minor version, its C++11 ABI
        # flag, and the Python version — compute all three from the torch
        # installed above so this stays correct if torch moves.
        echo ">>> Fetching prebuilt flash-attn wheel (no source build)..."
        FA_URL="$(/workspace/isaaclab/_isaac_sim/python.sh -c 'import sys, torch; tv=".".join(torch.__version__.split(".")[:2]); abi="TRUE" if torch._C._GLIBCXX_USE_CXX11_ABI else "FALSE"; cp=f"cp{sys.version_info.major}{sys.version_info.minor}"; print(f"https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch{tv}cxx11abi{abi}-{cp}-{cp}-linux_x86_64.whl")')"
        echo ">>> flash-attn wheel: ${FA_URL}"
        WHEEL_DIR=/tmp/flash-attn-wheel
        mkdir -p "${WHEEL_DIR}"
        curl -fsSL -o "${WHEEL_DIR}/$(basename "${FA_URL}")" "${FA_URL}"
        /workspace/isaaclab/_isaac_sim/python.sh -m pip install \
          --target "${PKGS_DIR}" --no-deps "${WHEEL_DIR}"/*.whl

        # Install gr00t's runtime deps, then gr00t itself. Drop three deps:
        #  - flash-attn: already installed as a prebuilt wheel above; leaving it
        #    in makes pip rebuild its sdist (missing nvcc → fail).
        #  - deepspeed: a training-only dep. transformers.modeling_utils auto-
        #    imports it when installed, and deepspeed JIT-probes CUDA ops at
        #    import (needs CUDA_HOME/nvcc, absent in the runtime image). Removing
        #    it makes transformers' is_deepspeed_available() return False so the
        #    inference server imports cleanly.
        # Keep torch==2.7.0/torchvision==0.22.0 pinned in the list so they
        # anchor the resolver: unpinned, torchcodec drags in the latest torch
        # (2.13/cu13) and breaks the torch-2.7 flash-attn wheel's ABI.
        echo ">>> Installing gr00t runtime deps (flash-attn/deepspeed excluded)..."
        /workspace/isaaclab/_isaac_sim/python.sh - /tmp/Isaac-GR00T/pyproject.toml /tmp/gr00t-reqs.txt <<'PY'
        import sys, tomllib
        src, dst = sys.argv[1], sys.argv[2]
        with open(src, "rb") as f:
            deps = tomllib.load(f)["project"]["dependencies"]
        skip = {"flash-attn", "deepspeed"}
        keep = [d for d in deps if d.split("==")[0].split(">")[0].split("<")[0].strip().lower() not in skip]
        with open(dst, "w") as f:
            f.write("\n".join(keep) + "\n")
        print("gr00t deps to install:", keep)
        PY
        /workspace/isaaclab/_isaac_sim/python.sh -m pip install \
          --target "${PKGS_DIR}" -r /tmp/gr00t-reqs.txt

        # Do NOT pip-install the gr00t package: its Eagle backbone loads a
        # bundled HF model dir (gr00t/model/modules/nvidia/Eagle-Block2A-2B-v2)
        # that has no __init__.py, so setuptools' packages.find never ships it —
        # the installed copy is missing it and AutoConfig fails with
        # "Unrecognized model". Instead run the server straight from the git
        # clone, whose source tree has the Eagle dir intact, by prepending it to
        # PYTHONPATH so `import gr00t` resolves to source.
        export PYTHONPATH="/tmp/Isaac-GR00T:${PYTHONPATH:-}"

        echo ">>> Starting GR00T policy server on port ${POLICY_PORT}..."
        /workspace/isaaclab/_isaac_sim/python.sh /tmp/Isaac-GR00T/gr00t/eval/run_gr00t_server.py \
          --model_path "${MODEL_PATH}" \
          --embodiment_tag "${EMBODIMENT_TAG}" \
          --host 0.0.0.0 \
          --port "${POLICY_PORT}" \
          > "${ARTIFACT_DIR}/logs/server.log" 2>&1 &
        SERVER_PID=$!
        trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

        echo ">>> Waiting for policy server..."
        for i in $(seq 1 120); do
          if /workspace/isaaclab/_isaac_sim/python.sh - "${POLICY_HOST}" "${POLICY_PORT}" <<'PY' 2>/dev/null; then
        import sys, zmq, msgpack
        host, port = sys.argv[1], sys.argv[2]
        ctx = zmq.Context()
        sock = ctx.socket(zmq.REQ)
        sock.setsockopt(zmq.RCVTIMEO, 2000)
        sock.connect(f"tcp://{host}:{port}")
        sock.send(msgpack.packb({"endpoint": "ping", "data": {}}))
        sock.recv()
        print("server ready")
        PY
            echo ">>> Server ready."
            break
          fi
          if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
            echo "Server died. Log:"; cat "${ARTIFACT_DIR}/logs/server.log"; exit 1
          fi
          sleep 5
        done

        # ── Prune CUDA/torch libs from PKGS_DIR before the eval ────────────
        # The eval (isaaclab.sh policy_inference.py) must import Isaac Sim's
        # OWN prebundled torch/CUDA, but PKGS_DIR is on PYTHONPATH for leisaac
        # and also carries torch==2.7.0 + nvidia-*-cu12 wheels. Isaac Sim's
        # bundled cusparse needs nvJitLink >=12.8 (__nvJitLinkCreate_12_8);
        # PKGS_DIR's older nvidia-nvjitlink-cu12 shadows it and the import
        # fails with "undefined symbol __nvJitLinkCreate_12_8". The GR00T
        # server subprocess already imported these libs (its .so files stay
        # mmap'd via open inodes after unlink), so deleting them on disk now
        # is safe and leaves the eval a clean path to Isaac Sim's own CUDA.
        echo ">>> Pruning torch/CUDA wheels from PKGS_DIR so eval uses Isaac Sim's bundled torch..."
        rm -rf "${PKGS_DIR}"/torch "${PKGS_DIR}"/torch-*.dist-info \
          "${PKGS_DIR}"/torchvision "${PKGS_DIR}"/torchvision-*.dist-info \
          "${PKGS_DIR}"/torchvision.libs "${PKGS_DIR}"/torchcodec* \
          "${PKGS_DIR}"/functorch "${PKGS_DIR}"/triton "${PKGS_DIR}"/triton-*.dist-info \
          "${PKGS_DIR}"/nvidia "${PKGS_DIR}"/nvidia_*.dist-info \
          "${PKGS_DIR}"/flash_attn "${PKGS_DIR}"/flash_attn-*.dist-info \
          "${PKGS_DIR}"/flash_attn_2_cuda*.so 2>/dev/null || true

        # ── Closed-loop eval via leisaac policy_inference.py ───────────────
        # CLI shape follows leisaac's official N1.6 example
        # (docs/docs/resources/available_policy.md): policy_type=gr00tn1.6 selects
        # Gr00t16ServicePolicyClient; episode count is --eval_rounds (num_envs is
        # hardcoded to 1 in the script). --num_envs/--headless/--record_video/
        # --video_dir/--total_episode do not exist in policy_inference.py.
        echo ">>> Running closed-loop eval: ${TASK_NAME} x ${NUM_EPISODES} rounds..."
        cd "${SCRIPTS_DIR}"
        /workspace/isaaclab/isaaclab.sh -p scripts/evaluation/policy_inference.py \
          --task "${TASK_NAME}" \
          --eval_rounds "${NUM_EPISODES}" \
          --enable_cameras \
          --device cuda \
          --policy_type gr00tn1.6 \
          --policy_host "${POLICY_HOST}" \
          --policy_port "${POLICY_PORT}" \
          --policy_action_horizon "{{ policy_action_horizon }}" \
          --policy_timeout_ms "{{ policy_timeout_ms }}" \
          --policy_language_instruction "${INSTRUCTION}" \
          --step_hz "${STEP_HZ}" \
          2>&1 | tee "${ARTIFACT_DIR}/logs/rollout.log" || true

        kill "${SERVER_PID}" 2>/dev/null || true
        wait "${SERVER_PID}" 2>/dev/null || true

        # ── Summary ────────────────────────────────────────────────────────
        /workspace/isaaclab/_isaac_sim/python.sh /tmp/summarize.py "${ARTIFACT_DIR}" "${TASK_NAME}" "${NUM_EPISODES}" "${MODEL_PATH}" "${INSTRUCTION}"
        find "${ARTIFACT_DIR}" -maxdepth 3 -type f | sort
    - path: /tmp/patch_leisaac.py
      contents: |
        # Patch leisaac for GR00T N1.6 dynamic language key + ModalityConfig
        # deserialization. Distilled from run-isaaclab.sh Step 1a.
        import sys

        policy_client, serialization = sys.argv[1], sys.argv[2]

        try:
            with open(policy_client) as f:
                src = f.read()
            old = (
                '        super().__init__(host=host, port=port, timeout_ms=timeout_ms, ping_endpoint="ping")\n'
                '        self.camera_keys = camera_keys\n'
                '        self.modality_keys = modality_keys'
            )
            new = old + (
                '\n        try:\n'
                '            modality_config = self.call_endpoint("get_modality_config", requires_input=False)\n'
                '            self.language_key = modality_config["language"].modality_keys[0]\n'
                '        except Exception:\n'
                '            self.language_key = "annotation.human.action.task_description"'
            )
            old_lang = '"annotation.human.task_description": [[observation_dict["task_description"]]],'
            new_lang = 'self.language_key: [[observation_dict["task_description"]]],'
            if old in src and old_lang in src:
                src = src.replace(old, new).replace(old_lang, new_lang)
                with open(policy_client, "w") as f:
                    f.write(src)
                print("Patch 1 applied: dynamic language key.")
            else:
                print("Patch 1: structure changed or already patched — skipping.")
        except FileNotFoundError:
            print(f"Patch 1: {policy_client} not found — skipping.")

        try:
            with open(serialization) as f:
                src2 = f.read()
            patched = False
            model_old = 'class ModalityConfig(BaseModel):'
            model_new = 'class ModalityConfig(BaseModel):\n    model_config = {"extra": "ignore"}'
            if model_old in src2 and 'model_config' not in src2:
                src2 = src2.replace(model_old, model_new)
                patched = True
            decode_old = '            obj = ModalityConfig(**json.loads(obj["as_json"]))'
            decode_new = (
                '            as_json = obj["as_json"]\n'
                '            data = as_json if isinstance(as_json, dict) else json.loads(as_json)\n'
                '            obj = ModalityConfig(**data)'
            )
            if decode_old in src2:
                src2 = src2.replace(decode_old, decode_new)
                patched = True
            if patched:
                with open(serialization, "w") as f:
                    f.write(src2)
                print("Patch 2 applied: ModalityConfig deserialization fixed.")
            else:
                print("Patch 2: already patched or structure changed — skipping.")
        except FileNotFoundError:
            print(f"Patch 2: {serialization} not found — skipping.")
    - path: /tmp/patch_headless.py
      contents: |
        # Patch leisaac policy_inference.py for headless operation:
        #  (1) keyboard subscription must tolerate no app window;
        #  (2) disable env_cfg.wait_for_textures so env.reset() doesn't hang.
        # Distilled from run-isaaclab.sh Step 4.
        import sys
        path = sys.argv[1]
        with open(path) as f:
            src = f.read()
        old = (
            "        self._appwindow = omni.appwindow.get_default_app_window()\n"
            "        self._input = carb.input.acquire_input_interface()\n"
            "        self._keyboard = self._appwindow.get_keyboard()\n"
            "        self._keyboard_sub = self._input.subscribe_to_keyboard_events(\n"
            "            self._keyboard,\n"
            "            self._on_keyboard_event,\n"
            "        )"
        )
        new = (
            "        try:\n"
            "            self._appwindow = omni.appwindow.get_default_app_window()\n"
            "        except Exception:\n"
            "            self._appwindow = None\n"
            "        self._input = carb.input.acquire_input_interface()\n"
            "        if self._appwindow is not None:\n"
            "            self._keyboard = self._appwindow.get_keyboard()\n"
            "        else:\n"
            "            self._keyboard = None\n"
            "        if self._keyboard is not None:\n"
            "            self._keyboard_sub = self._input.subscribe_to_keyboard_events(\n"
            "                self._keyboard,\n"
            "                self._on_keyboard_event,\n"
            "            )\n"
            "        else:\n"
            "            self._keyboard_sub = None"
        )
        if old in src:
            src = src.replace(old, new)
            print("Patched policy_inference.py for headless keyboard support")
        else:
            print("Keyboard patch: already patched or structure changed — skipping")

        # Disable wait_for_textures: in headless (no viewport) the USD
        # ASSETS_LOADED stage event never fires, so manager_based_env.reset()'s
        # `while SimulationManager.assets_loading(): self.sim.render()` loop
        # spins forever (observed: env.reset hung 80+ min at 0% GPU util). The
        # scene assets are already on disk, so skipping the wait is safe.
        tex_old = "    env_cfg.recorders = None\n"
        tex_new = (
            "    env_cfg.recorders = None\n"
            "    if hasattr(env_cfg, 'wait_for_textures'):\n"
            "        env_cfg.wait_for_textures = False\n"
        )
        if tex_old in src and "env_cfg.wait_for_textures = False" not in src:
            src = src.replace(tex_old, tex_new)
            print("Patched policy_inference.py to disable wait_for_textures")
        else:
            print("wait_for_textures patch: already patched or structure changed — skipping")

        with open(path, "w") as f:
            f.write(src)
    - path: /tmp/summarize.py
      contents: |
        import json
        import sys
        from pathlib import Path

        artifact_dir = Path(sys.argv[1])
        task_name = sys.argv[2]
        num_episodes = int(sys.argv[3])
        model_path = sys.argv[4]
        instruction = sys.argv[5]

        rollout = artifact_dir / "logs" / "rollout.log"
        log = rollout.read_text() if rollout.exists() else ""
        videos = sorted((artifact_dir / "videos").rglob("*.mp4")) if (artifact_dir / "videos").exists() else []

        summary = {
            "task_name": task_name,
            "instruction": instruction,
            "model_path": model_path,
            "n_episodes_requested": num_episodes,
            "n_videos_recorded": len(videos),
            "video_files": [v.name for v in videos],
        }
        # leisaac's policy_inference.py prints one authoritative line at the
        # end: "Final success rate: <rate>  [<success>/<total>]". Parse the
        # [N/M] counts from it directly. (An earlier naive substring count of
        # "success"/"SUCCESS" over-counted: every per-episode "now success
        # rate: ..." line contains the word "success", so it reported a bogus
        # 100% rate.) Fall back to the last per-episode "now success rate"
        # line if the run was cut off before the Final line.
        import re
        counts = re.findall(r"success rate:\s*[\d.]+\s*\[(\d+)/(\d+)\]", log)
        if counts:
            success, total = (int(counts[-1][0]), int(counts[-1][1]))
            summary["success_count"] = success
            summary["fail_count"] = total - success
            summary["success_rate"] = (success / total) if total else 0.0

        (artifact_dir / "eval-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
        print(json.dumps(summary, indent=2))
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  cpu: 8
  memory: 90Gi
  storage: 200Gi
  platform: g6e-l40s
  isaac_lab_image: nvcr.io/nvidia/isaac-lab:2.3.0
  gr00t_repository: "https://github.com/NVIDIA/Isaac-GR00T"
  # leisaac's N1.6 doc pins this GR00T commit for ZMQ/server compat; N1.6
  # client/server behavior is commit-sensitive, so match leisaac's target.
  gr00t_ref: "e8e625f4f21898c506a1d8f7d20a289c97a52acf"
  leisaac_repository: "https://github.com/LightwheelAI/leisaac"
  leisaac_ref: "24d3bcd3f1e4585740fc79921782c41617237812"
  input_dataset: e2e-pipeline-groot-checkpoint
  output_dataset: e2e-pipeline-closeloop-artifacts
  embodiment_tag: NEW_EMBODIMENT
  task_name: "LeIsaac-SO101-PickOrange-v0"
  instruction: "pick up the orange and place it on the plate"
  num_episodes: 5
  policy_action_horizon: 16
  policy_timeout_ms: 5000
  step_hz: 30
  policy_port: 5555
