# Stage 1 — Data Prep
# Download a LeRobot dataset from Hugging Face, auto-convert v3.0 -> v2.1 (the
# format GR00T fine-tuning needs), validate it, and publish it as an OSMO
# dataset that Stage 3 (03-training) consumes.
#
# Mirrors e2e-workshop/groot/training/data/{upload_dataset,convert_v3_to_v2}.py
# but writes to an OSMO dataset instead of S3.
#
#   osmo workflow submit examples ... 01-data-prep/workflow.yaml \
#     --set hf_dataset_id=LightwheelAI/leisaac-pick-orange

workflow:
  name: aws-e2e-data-prep
  timeout:
    exec_timeout: 2h
    queue_timeout: 1h
  resources:
    cpu:
      cpu: {{ cpu }}
      memory: {{ memory }}
      storage: {{ storage }}

  tasks:
  - name: prepare
    resource: cpu
    image: {{ image_name }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    credentials:
      huggingface_token:
        HF_TOKEN: token
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail

        export DEBIAN_FRONTEND=noninteractive
        export HF_HOME=/tmp/hf-home
        export HUGGING_FACE_HUB_TOKEN="${HF_TOKEN:-}"
        export PYTHONUNBUFFERED=1

        HF_DATASET_ID="{{ hf_dataset_id }}"
        DEFAULT_TASK="{{ default_task }}"
        ARTIFACT_DIR="{{output}}/artifacts"

        apt-get update >/dev/null
        apt-get install -y --no-install-recommends \
          ca-certificates curl ffmpeg git git-lfs python3 python3-pip >/dev/null
        git lfs install --skip-repo >/dev/null
        pip install --quiet --no-input "huggingface_hub>=0.24" "pyarrow>=15.0.0" numpy

        RAW_DIR=/tmp/dataset-raw
        mkdir -p "${RAW_DIR}" "${ARTIFACT_DIR}"

        echo ">>> Downloading dataset ${HF_DATASET_ID} from Hugging Face..."
        python - "${HF_DATASET_ID}" "${RAW_DIR}" <<'PY'
        import sys
        from huggingface_hub import snapshot_download
        dataset_id, local_dir = sys.argv[1], sys.argv[2]
        snapshot_download(repo_id=dataset_id, repo_type="dataset", local_dir=local_dir)
        print(f"Downloaded {dataset_id} -> {local_dir}")
        PY

        echo ">>> Converting (v3 -> v2.1 if needed), validating, and staging..."
        python /tmp/prepare_dataset.py "${RAW_DIR}" "${ARTIFACT_DIR}" "${DEFAULT_TASK}"

        find "${ARTIFACT_DIR}" -maxdepth 3 -type f | sort | head -100
        exit 0
    - path: /tmp/prepare_dataset.py
      contents: |
        #!/usr/bin/env python3
        """Detect LeRobot v3.0 -> convert to v2.1, validate, stage to OSMO output.

        Distilled from e2e-workshop/groot/training/data/convert_v3_to_v2.py and
        upload_dataset.py so the OSMO pipeline produces the exact dataset shape
        GR00T fine-tuning expects.
        """
        import json
        import math
        import shutil
        import subprocess
        import sys
        from pathlib import Path

        CHUNKS_SIZE_DEFAULT = 1000


        def is_v3(root: Path) -> bool:
            info = root / "meta" / "info.json"
            if not info.exists():
                return False
            return json.loads(info.read_text()).get("codebase_version", "").startswith("v3")


        def load_episodes(root: Path):
            import pyarrow.parquet as pq
            files = sorted((root / "meta" / "episodes").glob("chunk-*/file-*.parquet"))
            if not files:
                raise FileNotFoundError(f"no episode parquet under {root/'meta'/'episodes'}")
            records = []
            for f in files:
                records.extend(pq.read_table(f).to_pylist())
            records.sort(key=lambda r: int(r["episode_index"]))
            print(f"  loaded {len(records)} episodes")
            return records


        def convert_data(root: Path, episodes, chunks_size):
            import pyarrow.parquet as pq
            grouped = {}
            for ep in episodes:
                key = (int(ep["data/chunk_index"]), int(ep["data/file_index"]))
                grouped.setdefault(key, []).append(ep)
            for (chunk_idx, file_idx), eps in grouped.items():
                src = root / f"data/chunk-{chunk_idx:03d}/file-{file_idx:03d}.parquet"
                if not src.exists():
                    continue
                table = pq.read_table(src)
                eps = sorted(eps, key=lambda r: int(r["dataset_from_index"]))
                file_offset = int(eps[0]["dataset_from_index"])
                for ep in eps:
                    ep_idx = int(ep["episode_index"])
                    start = int(ep["dataset_from_index"]) - file_offset
                    length = int(ep["dataset_to_index"]) - int(ep["dataset_from_index"])
                    dest_chunk = ep_idx // chunks_size
                    dest = root / f"data/chunk-{dest_chunk:03d}/episode_{ep_idx:06d}.parquet"
                    dest.parent.mkdir(parents=True, exist_ok=True)
                    pq.write_table(table.slice(start, length), dest)
                src.unlink()
            print("  data/ split into per-episode parquet")


        def convert_videos(root: Path, episodes, video_keys, chunks_size):
            if not video_keys:
                print("  no video keys")
                return
            if shutil.which("ffmpeg") is None:
                print("  WARNING: ffmpeg missing, skipping video split")
                return
            for vk in video_keys:
                cc, fc = f"videos/{vk}/chunk_index", f"videos/{vk}/file_index"
                fts, tts = f"videos/{vk}/from_timestamp", f"videos/{vk}/to_timestamp"
                grouped = {}
                for ep in episodes:
                    if cc not in ep or ep[cc] is None:
                        continue
                    grouped.setdefault((int(ep[cc]), int(ep[fc])), []).append(ep)
                for (chunk_idx, file_idx), eps in grouped.items():
                    src = root / f"videos/{vk}/chunk-{chunk_idx:03d}/file-{file_idx:03d}.mp4"
                    if not src.exists():
                        continue
                    for ep in sorted(eps, key=lambda r: float(r[fts])):
                        ep_idx = int(ep["episode_index"])
                        start, end = float(ep[fts]), float(ep[tts])
                        duration = max(end - start, 1e-6)
                        dest_chunk = ep_idx // chunks_size
                        dest = root / f"videos/chunk-{dest_chunk:03d}/{vk}/episode_{ep_idx:06d}.mp4"
                        dest.parent.mkdir(parents=True, exist_ok=True)
                        subprocess.run(
                            ["ffmpeg", "-hide_banner", "-loglevel", "error",
                             "-ss", f"{start:.6f}", "-i", str(src), "-t", f"{duration:.6f}",
                             "-c", "copy", "-avoid_negative_ts", "1", "-y", str(dest)],
                            check=True, timeout=300, capture_output=True)
                    src.unlink()
                shutil.rmtree(root / f"videos/{vk}", ignore_errors=True)
            print("  videos/ split into per-episode mp4")


        def _to_serializable(v):
            import numpy as np
            if isinstance(v, np.ndarray):
                return v.tolist()
            if isinstance(v, np.generic):
                return v.item()
            if isinstance(v, (list, tuple)):
                return [_to_serializable(x) for x in v]
            if isinstance(v, dict):
                return {k: _to_serializable(x) for k, x in v.items()}
            return v


        def _unflatten(flat):
            out = {}
            for key, value in flat.items():
                parts = key.split("/")
                d = out
                for p in parts[:-1]:
                    d = d.setdefault(p, {})
                d[parts[-1]] = value
            return out


        def convert_episodes_meta(root: Path, episodes):
            ep_path = root / "meta" / "episodes.jsonl"
            st_path = root / "meta" / "episodes_stats.jsonl"
            with ep_path.open("w") as ef, st_path.open("w") as sf:
                for ep in sorted(episodes, key=lambda r: int(r["episode_index"])):
                    legacy = {}
                    for k, v in ep.items():
                        if k.startswith(("data/", "videos/", "stats/", "meta/")):
                            continue
                        if k in ("dataset_from_index", "dataset_to_index"):
                            continue
                        legacy[k] = _to_serializable(v)
                    if "length" not in legacy and "dataset_from_index" in ep:
                        legacy["length"] = int(ep["dataset_to_index"]) - int(ep["dataset_from_index"])
                    ef.write(json.dumps(legacy, ensure_ascii=False) + "\n")
                    stats_flat = {k: _to_serializable(ep[k]) for k in ep if k.startswith("stats/")}
                    if stats_flat:
                        sf.write(json.dumps({
                            "episode_index": int(ep["episode_index"]),
                            "stats": _unflatten(stats_flat).get("stats", {}),
                        }, ensure_ascii=False) + "\n")
            shutil.rmtree(root / "meta" / "episodes", ignore_errors=True)
            print(f"  episodes.jsonl ({len(episodes)}), episodes_stats.jsonl written")


        def ensure_tasks_jsonl(root: Path, default_task: str):
            tasks_pq = root / "meta" / "tasks.parquet"
            tasks_jsonl = root / "meta" / "tasks.jsonl"
            if tasks_pq.exists():
                import pyarrow.parquet as pq
                df = pq.read_table(tasks_pq).to_pandas()
                with tasks_jsonl.open("w") as f:
                    for task_desc, row in df.iterrows():
                        f.write(json.dumps({"task_index": int(row["task_index"]),
                                            "task": str(task_desc)}, ensure_ascii=False) + "\n")
                tasks_pq.unlink()
                print("  tasks.parquet -> tasks.jsonl")
                return
            if tasks_jsonl.exists():
                print("  tasks.jsonl present")
                return
            descriptions = set()
            episodes_jsonl = root / "meta" / "episodes.jsonl"
            if episodes_jsonl.exists():
                for line in episodes_jsonl.read_text().splitlines():
                    for t in json.loads(line).get("tasks", []):
                        descriptions.add(t)
            tasks_jsonl.parent.mkdir(parents=True, exist_ok=True)
            with tasks_jsonl.open("w") as f:
                items = sorted(descriptions) or [default_task]
                for i, desc in enumerate(items):
                    f.write(json.dumps({"task_index": i, "task": desc}, ensure_ascii=False) + "\n")
            print(f"  tasks.jsonl generated ({len(items)} task(s))")


        def update_info(root: Path, episodes, video_keys):
            info = json.loads((root / "meta" / "info.json").read_text())
            total = info.get("total_episodes", len(episodes))
            chunks_size = info.get("chunks_size", CHUNKS_SIZE_DEFAULT)
            info["codebase_version"] = "v2.1"
            info["data_path"] = "data/chunk-{episode_chunk:03d}/episode_{episode_index:06d}.parquet"
            info["video_path"] = (
                "videos/chunk-{episode_chunk:03d}/{video_key}/episode_{episode_index:06d}.mp4"
                if video_keys else None
            )
            info.pop("data_files_size_in_mb", None)
            info.pop("video_files_size_in_mb", None)
            for ft in info.get("features", {}).values():
                if ft.get("dtype") != "video":
                    ft.pop("fps", None)
            info["total_chunks"] = math.ceil(total / chunks_size) if total else 0
            info["total_videos"] = total * len(video_keys)
            (root / "meta" / "info.json").write_text(json.dumps(info, indent=4, ensure_ascii=False))
            print("  info.json -> v2.1")


        def convert_v3_to_v2(root: Path, default_task: str):
            info = json.loads((root / "meta" / "info.json").read_text())
            chunks_size = info.get("chunks_size", CHUNKS_SIZE_DEFAULT)
            episodes = load_episodes(root)
            video_keys = [k for k, v in info.get("features", {}).items() if v.get("dtype") == "video"]
            convert_data(root, episodes, chunks_size)
            convert_videos(root, episodes, video_keys, chunks_size)
            convert_episodes_meta(root, episodes)
            ensure_tasks_jsonl(root, default_task)
            update_info(root, episodes, video_keys)


        def validate(root: Path):
            errors = []
            info_path = root / "meta" / "info.json"
            if not info_path.exists():
                errors.append("meta/info.json missing")
            else:
                info = json.loads(info_path.read_text())
                for field in ("robot_type", "fps", "features"):
                    if field not in info:
                        errors.append(f"meta/info.json missing '{field}'")
            parquet = list((root / "data").rglob("*.parquet")) if (root / "data").exists() else []
            if not parquet:
                errors.append("no data/*.parquet")
            if not (root / "meta" / "tasks.jsonl").exists():
                errors.append("meta/tasks.jsonl missing")
            if not (root / "meta" / "modality.json").exists():
                errors.append("meta/modality.json missing")
            if errors:
                raise SystemExit("LeRobot v2 validation failed:\n" + "\n".join(f"  - {e}" for e in errors))
            print(f"  validation OK ({len(parquet)} episode parquet files)")
            return {"episode_parquet_files": len(parquet)}


        # SO-101 (6-DOF) GR00T modality map: LeRobot state/action columns ->
        # GR00T modality index ranges + camera/annotation key aliases. GR00T's
        # LeRobotEpisodeLoader requires meta/modality.json; the LeRobot dataset
        # ships without it, so Stage 1 writes it here (copy of e2e-workshop
        # groot/training/data/configs/so101_modality.json) to keep the produced
        # dataset self-contained for Stage 3 fine-tuning.
        SO101_MODALITY = {
            "state": {
                "single_arm": {"start": 0, "end": 5},
                "gripper": {"start": 5, "end": 6},
            },
            "action": {
                "single_arm": {"start": 0, "end": 5},
                "gripper": {"start": 5, "end": 6},
            },
            "video": {
                "front": {"original_key": "observation.images.front"},
                "wrist": {"original_key": "observation.images.wrist"},
            },
            "annotation": {
                "human.task_description": {"original_key": "task_index"},
            },
        }


        def ensure_modality_json(root: Path):
            path = root / "meta" / "modality.json"
            if path.exists():
                print("  meta/modality.json present")
                return
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(json.dumps(SO101_MODALITY, indent=4) + "\n")
            print("  meta/modality.json written (SO-101 6-DOF)")


        def main():
            raw, out, default_task = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
            if is_v3(raw):
                print(">>> LeRobot v3 detected -> converting to v2.1")
                convert_v3_to_v2(raw, default_task)
            else:
                print(">>> Not v3 (assuming v2.x); ensuring tasks.jsonl")
                ensure_tasks_jsonl(raw, default_task)
            ensure_modality_json(raw)
            stats = validate(raw)

            dataset_out = out / "dataset"
            if dataset_out.exists():
                shutil.rmtree(dataset_out)
            shutil.copytree(raw, dataset_out)

            info = json.loads((raw / "meta" / "info.json").read_text())
            manifest = {
                "codebase_version": info.get("codebase_version"),
                "robot_type": info.get("robot_type"),
                "fps": info.get("fps"),
                "total_episodes": info.get("total_episodes"),
                **stats,
            }
            (out / "dataset-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
            print(json.dumps(manifest, indent=2))


        if __name__ == "__main__":
            main()
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  cpu: 4
  memory: 16Gi
  storage: 12Gi
  image_name: "python:3.12-slim"
  hf_dataset_id: LightwheelAI/leisaac-pick-orange
  default_task: "pick up the orange and place it on the plate"
  output_dataset: e2e-pipeline-lerobot-dataset
