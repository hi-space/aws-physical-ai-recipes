# Stage 6 — Cosmos Transfer 2.5 Visual Augmentation (optional)
# Photorealistic visual augmentation of the Stage 1 LeRobot dataset with Cosmos
# Transfer 2.5, using EDGE control (RGB-only — the leisaac SO-101 dataset ships
# no depth videos). Each per-episode camera mp4 is re-rendered through Cosmos and
# written back into the same LeRobot layout, so Stage 3 (03-training) can consume
# the augmented dataset with no changes other than --set input_dataset=...
#
# Optional middle step: the default chain is Stage 1 -> Stage 3. Insert this
# stage only when you want domain-randomized / photorealistic training frames.
#
#   osmo workflow submit e2e-pipeline-examples/06-cosmos-augment/workflow.yaml \
#     --set input_dataset=e2e-pipeline-lerobot-dataset \
#     --set output_dataset=e2e-pipeline-lerobot-dataset-cosmos
#
# then point Stage 3 at the augmented dataset:
#
#   osmo workflow submit e2e-pipeline-examples/03-training/workflow.yaml \
#     --set input_dataset=e2e-pipeline-lerobot-dataset-cosmos

workflow:
  name: aws-e2e-cosmos-augment
  timeout:
    exec_timeout: 3d
    queue_timeout: 1d
  resources:
    gpu:
      cpu: {{ cpu }}
      gpu: 1
      memory: {{ memory }}
      storage: {{ storage }}
      platform: {{ platform }}

  tasks:
  - name: cosmos-augment
    resource: gpu
    image: {{ image_name }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    credentials:
      huggingface_token:
        HF_TOKEN: token
    environment:
      ACCEPT_EULA: Y
    inputs:
    - dataset:
        name: {{ input_dataset }}
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail
        export TORCH_CUDA_ARCH_LIST="12.0"
        export PYTHONUNBUFFERED=1
        export HF_HOME=/tmp/hf-home

        COSMOS_REF="{{ cosmos_transfer_ref }}"
        TOKENIZER_FROM="{{ tokenizer_revision_from }}"
        TOKENIZER_TO="{{ tokenizer_revision_to }}"
        CONTROL="{{ control_mode }}"
        PROMPT="{{ prompt }}"
        NUM_STEPS="{{ num_steps }}"
        RESOLUTION="{{ resolution }}"
        ARTIFACT_DIR="{{output}}/artifacts"

        echo "=== System Info ==="
        nvidia-smi

        # --- Locate the Stage 1 LeRobot root (same discovery as Stage 3) -------
        DATASET_DIR="{{input:0}}/dataset"
        if [ ! -d "${DATASET_DIR}/meta" ]; then
          INFO_JSON="$(find "{{input:0}}" -maxdepth 6 -type f -path '*/meta/info.json' 2>/dev/null | sort | head -1)"
          if [ -n "${INFO_JSON}" ]; then
            DATASET_DIR="$(dirname "$(dirname "${INFO_JSON}")")"
          else
            DATASET_DIR="{{input:0}}"
          fi
        fi
        test -d "${DATASET_DIR}/meta"
        echo ">>> Using LeRobot dataset at ${DATASET_DIR}"

        # --- Install Cosmos Transfer 2.5 (pinned, tokenizer patch) -------------
        cd /workspace
        git clone https://github.com/nvidia-cosmos/cosmos-transfer2.5.git
        cd cosmos-transfer2.5
        git checkout "${COSMOS_REF}"
        grep -q "${TOKENIZER_FROM}" cosmos_transfer2/_src/imaginaire/utils/checkpoint_db.py
        sed -i "s/${TOKENIZER_FROM}/${TOKENIZER_TO}/g" cosmos_transfer2/_src/imaginaire/utils/checkpoint_db.py

        # The guardrail package eagerly downloads the gated nvidia/Cosmos-Guardrail1
        # checkpoint at IMPORT time (core.py: GUARDRAIL1_CHECKPOINT_DIR =
        # get_checkpoint_by_uuid(...).path), which 403s for HF accounts not on its
        # authorized list — before --disable-guardrails can take effect. Since the
        # dir is only read by the content-safety/blocklist/face-blur filters (all
        # skipped when guardrails are disabled), replace the eager download with a
        # placeholder so the import succeeds. Fail loudly if the line moved.
        GUARDRAIL_CORE="cosmos_transfer2/_src/imaginaire/auxiliary/guardrail/common/core.py"
        grep -q 'GUARDRAIL1_CHECKPOINT_DIR = get_checkpoint_by_uuid' "${GUARDRAIL_CORE}"
        sed -i 's|^GUARDRAIL1_CHECKPOINT_DIR = get_checkpoint_by_uuid.*|GUARDRAIL1_CHECKPOINT_DIR = "/tmp/guardrail-disabled"|' "${GUARDRAIL_CORE}"
        curl -LsSf https://astral.sh/uv/install.sh | sh && source "$HOME/.local/bin/env"
        uv sync --extra=cu128
        source .venv/bin/activate
        pip3 install tyro

        set +x
        git config --global credential.helper store
        huggingface-cli login --token "${HF_TOKEN}" --add-to-git-credential
        set -x

        # --- Stage the dataset to the output, then replace RGB mp4s in place ----
        OUT_DS="${ARTIFACT_DIR}/dataset"
        mkdir -p "${ARTIFACT_DIR}"
        cp -r "${DATASET_DIR}" "${OUT_DS}"

        # Cosmos Transfer edge control spec: copy the shipped robot example spec
        # if present, otherwise fall back to a minimal edge spec. The exact asset
        # path/schema at the pinned ref is a runtime-verification item (see README).
        SPEC_TEMPLATE=""
        for cand in \
          assets/robot_example/edge/robot_edge_spec.json \
          assets/robot_example/robot_edge_spec.json \
          assets/robot_example/robot_spec.json; do
          if [ -f "$cand" ]; then SPEC_TEMPLATE="$cand"; break; fi
        done
        mkdir -p /tmp/cosmos_specs

        # Enumerate per-episode RGB mp4s the LeRobot v2.1 layout produces:
        #   videos/chunk-XXX/<video_key>/episode_XXXXXX.mp4
        MP4_LIST_FILE="$(mktemp)"
        find "${OUT_DS}/videos" -type f -name 'episode_*.mp4' 2>/dev/null | sort > "${MP4_LIST_FILE}"
        MP4_COUNT="$(wc -l < "${MP4_LIST_FILE}")"
        echo ">>> LeRobot RGB mp4 count: ${MP4_COUNT}"
        if [ "${MP4_COUNT}" -eq 0 ]; then
          echo "No per-episode mp4 under ${OUT_DS}/videos" >&2
          find "${OUT_DS}" -maxdepth 4 -type f | head -n 50
          exit 1
        fi

        # Read the list on FD 9, not stdin: Cosmos' inference.py consumes stdin,
        # which would drain MP4_LIST_FILE and silently end the loop after the
        # first video (leaving later camera mp4s un-augmented but exiting 0).
        AUGMENTED_COUNT=0
        while IFS= read -r -u 9 mp4_file; do
          [ -f "${mp4_file}" ] || continue
          rel="${mp4_file#${OUT_DS}/}"
          echo "=== Augmenting ${rel} ==="

          # Source frame count + fps: Cosmos output must be re-aligned to these
          # so LeRobot per-episode frame indexing stays valid.
          src_nframes="$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames -of csv=p=0 "${mp4_file}" 2>/dev/null || echo '')"
          src_fps="$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=r_frame_rate -of csv=p=0 "${mp4_file}" 2>/dev/null || echo '')"
          echo "   source frames=${src_nframes} fps=${src_fps}"

          spec_file="/tmp/cosmos_specs/spec.json"
          if [ -n "${SPEC_TEMPLATE}" ]; then
            cp "${SPEC_TEMPLATE}" "${spec_file}"
          else
            printf '{}' > "${spec_file}"
          fi
          python3 - "${spec_file}" "${mp4_file}" "${CONTROL}" "${PROMPT}" "${NUM_STEPS}" "${RESOLUTION}" <<'PYSPEC'
        import json, os, sys
        spec_path, video_path, control, prompt, num_steps, resolution = sys.argv[1:7]
        with open(spec_path) as f:
            spec = json.load(f)
        # name is a required Cosmos field; keep the template's or derive one so the
        # minimal-fallback spec ({}) is also valid.
        spec.setdefault("name", os.path.splitext(os.path.basename(video_path))[0])
        spec["video_path"] = video_path
        # Use an inline prompt and drop the template's prompt_path — the shipped
        # spec references ../robot_prompt.txt, which does not exist next to the
        # copied spec and would fail Cosmos's FilePath validation. Cosmos allows
        # only one of {prompt, prompt_path}.
        spec["prompt"] = prompt
        spec.pop("prompt_path", None)
        # EDGE control (RGB-only): drop any pre-computed control_path the template
        # carries (the shipped edge spec points at robot_edge.mp4, a dangling
        # relative path here) so Cosmos derives the edge hint on-the-fly from the
        # RGB frames via its CannyEdge model. Also drop depth — no depth videos.
        for key in ("edge", "depth", "vis", "seg"):
            spec.pop(key, None)
        spec[control] = {"control_weight": 1.0}
        # num_steps / resolution are InferenceArguments override fields Cosmos reads
        # from the spec json (CLI would also work). num_steps is the dominant runtime
        # knob: wall-clock is ~linear in it (default 35 => ~80 min/episode on L40S).
        # Lowering it (e.g. 15) trades photorealism for speed; resolution 720->480
        # cuts per-chunk compute further.
        spec["num_steps"] = int(num_steps)
        spec["resolution"] = resolution
        with open(spec_path, "w") as f:
            json.dump(spec, f, indent=2)
        print(f"spec: control={control} video={video_path} num_steps={num_steps} resolution={resolution}")
        PYSPEC

          rm -rf /workspace/cosmos-transfer2.5/outputs
          # --disable-guardrails skips the gated nvidia/Cosmos-Guardrail1 HF model
          # (a content-safety filter). Our inputs are robot teleop clips with a
          # fixed benign prompt, and the model is access-gated so loading it fails
          # with "not in the authorized list"; disabling it is required to run.
          python /workspace/cosmos-transfer2.5/examples/inference.py \
            -i "${spec_file}" \
            -o /workspace/cosmos-transfer2.5/outputs \
            --disable-guardrails

          gen="$(find /workspace/cosmos-transfer2.5/outputs -type f -name '*.mp4' | sort | head -1)"
          if [ -z "${gen}" ]; then
            echo "Cosmos produced no mp4 for ${rel}" >&2
            exit 1
          fi

          # Re-align the augmented clip to the source frame count + fps and write
          # it back into the LeRobot layout at the SAME relative path. LeRobot
          # per-episode indexing requires the mp4 to keep EXACTLY src_nframes
          # frames, so we only re-encode when both fps and a positive frame count
          # were probed; otherwise we copy the clip through unchanged rather than
          # risk truncating it to a zero-frame file.
          if [ -n "${src_fps}" ] && [ -n "${src_nframes}" ] && [ "${src_nframes}" -gt 0 ] 2>/dev/null; then
            # tpad=stop_mode=clone extends a short Cosmos clip by repeating its
            # last frame; -frames:v then trims to the exact source count, so the
            # result is padded-or-capped to src_nframes regardless of Cosmos'
            # output length.
            ffmpeg -hide_banner -loglevel error -y -i "${gen}" \
              -vf "tpad=stop_mode=clone:stop_duration=3600,fps=${src_fps}" \
              -frames:v "${src_nframes}" \
              -c:v libx264 -pix_fmt yuv420p "${mp4_file}.tmp.mp4" \
              && mv "${mp4_file}.tmp.mp4" "${mp4_file}"
          else
            echo "   WARN: could not probe source frames/fps (frames='${src_nframes}' fps='${src_fps}'); copying Cosmos clip without frame re-alignment" >&2
            cp "${gen}" "${mp4_file}"
          fi
          AUGMENTED_COUNT=$((AUGMENTED_COUNT + 1))
          echo "   wrote augmented ${rel} (${AUGMENTED_COUNT}/${MP4_COUNT})"

          # Cosmos writes into a fixed outputs dir; clear it so the next
          # iteration's `find ... | head -1` cannot pick up this clip again.
          rm -rf /workspace/cosmos-transfer2.5/outputs
          mkdir -p /workspace/cosmos-transfer2.5/outputs
        done 9< "${MP4_LIST_FILE}"

        # Every discovered mp4 must have been augmented; a short count means the
        # loop skipped one (the stdin-drain bug's signature) and the dataset would
        # ship a mix of augmented and untouched clips under a "success" status.
        if [ "${AUGMENTED_COUNT}" -ne "${MP4_COUNT}" ]; then
          echo "augmented ${AUGMENTED_COUNT} of ${MP4_COUNT} mp4s — refusing to publish a partially augmented dataset" >&2
          exit 1
        fi

        # --- Manifest ----------------------------------------------------------
        python3 - "${OUT_DS}" "${ARTIFACT_DIR}" "${CONTROL}" "${AUGMENTED_COUNT}" <<'PYMAN'
        import json, sys
        from pathlib import Path
        out_ds, artifact_dir, control, count = sys.argv[1:5]
        info = json.loads((Path(out_ds) / "meta" / "info.json").read_text())
        manifest = {
            "augmentation": "cosmos-transfer-2.5",
            "control_mode": control,
            "videos_augmented": int(count),
            "codebase_version": info.get("codebase_version"),
            "total_episodes": info.get("total_episodes"),
            "fps": info.get("fps"),
        }
        (Path(artifact_dir) / "augmentation-manifest.json").write_text(
            json.dumps(manifest, indent=2) + "\n")
        print(json.dumps(manifest, indent=2))
        PYMAN

        echo "=== Cosmos augmentation complete ==="
        find "${ARTIFACT_DIR}" -maxdepth 5 -type f | sort | head -100
        exit 0
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  cpu: 30
  memory: 128Gi
  storage: 200Gi
  # g6e-l40s (48GB VRAM) is the default fallback. Cosmos Transfer 2.5 is a heavy
  # diffusion workload and may OOM on 48GB at higher resolutions / frame counts;
  # override --set platform=g7e-rtx-pro-6000 (96GB) if augmentation hits CUDA OOM.
  platform: g6e-l40s
  image_name: "nvcr.io/nvidia/cosmos/cosmos-predict2-container:1.2"
  input_dataset: e2e-pipeline-lerobot-dataset
  output_dataset: e2e-pipeline-lerobot-dataset-cosmos
  control_mode: edge
  prompt: "A robot arm performing a manipulation task in a photorealistic kitchen, natural lighting, high detail"
  # num_steps is the dominant runtime knob — Cosmos diffusion wall-clock is ~linear
  # in it. Default 35 (Cosmos' own default) ~= 80 min/episode on an L40S (774-frame
  # clip => 9 chunks x 35 steps). The full 120-clip dataset at 35 steps exceeds the
  # 3d exec_timeout, so lower it for time-boxed runs: --set num_steps=15 roughly
  # halves the time (some photorealism loss), num_steps=10 ~cuts it to a third.
  num_steps: 35
  # Output resolution ('720' or '480'). '480' cuts per-chunk compute (and VRAM)
  # further at lower fidelity; keep '720' for training-grade augmentation.
  resolution: "720"
  cosmos_transfer_ref: "0033b77a9e41e74f9d8d0b9cf80e0ecf94b3533b"
  tokenizer_revision_from: "6787e176dce74a101d922174a95dba29fa5f0c55"
  tokenizer_revision_to: "f176dc95b4a70f53ce01c4b302851595e7322b00"
