# Stage 2 — Sim (RL Policy)
# Isaac Lab reinforcement-learning track from the e2e workshop (Modules 2-4):
# train an H1 humanoid to walk on rough terrain with PPO, then replay the
# learned policy headless and record before/after videos.
#
# Standalone stage — does not depend on Stage 1. Produces a .pt checkpoint,
# TensorBoard scalars, and rollout videos as an OSMO dataset.
#
#   osmo workflow submit examples ... 02-sim/workflow.yaml

workflow:
  name: aws-e2e-sim-rl
  timeout:
    exec_timeout: 8h
    queue_timeout: 1h
  resources:
    gpu:
      cpu: 8
      gpu: 1
      memory: 64Gi
      storage: 200Gi
      platform: g7e-rtx-pro-6000

  tasks:
  - name: train-and-render
    resource: gpu
    image: {{ isaac_lab_image }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail

        export ACCEPT_EULA=Y
        export PRIVACY_CONSENT=Y
        export MPLBACKEND=Agg

        ISAACLAB_ROOT="{{ isaaclab_root }}"
        RL_FRAMEWORK="{{ rl_framework }}"
        TASK_NAME="{{ task_name }}"
        TRAIN_NUM_ENVS="{{ train_num_envs }}"
        PLAY_NUM_ENVS="{{ play_num_envs }}"
        MAX_ITERATIONS="{{ max_iterations }}"
        VIDEO_LENGTH="{{ video_length }}"
        ARTIFACT_DIR="{{output}}/artifacts"

        nvidia-smi

        if [ ! -x "${ISAACLAB_ROOT}/isaaclab.sh" ]; then
          for candidate in /workspace/IsaacLab /workspace/isaaclab /workspace/isaac-lab; do
            if [ -x "${candidate}/isaaclab.sh" ]; then
              ISAACLAB_ROOT="${candidate}"
              break
            fi
          done
        fi
        test -x "${ISAACLAB_ROOT}/isaaclab.sh"
        cd "${ISAACLAB_ROOT}"

        if ! command -v ffmpeg >/dev/null 2>&1; then
          apt-get update >/dev/null
          apt-get install -y --no-install-recommends ffmpeg >/dev/null
        fi

        ./isaaclab.sh -i "${RL_FRAMEWORK}"
        ./isaaclab.sh -p -m pip install --quiet tensorboard matplotlib

        mkdir -p "${ARTIFACT_DIR}/checkpoints" \
          "${ARTIFACT_DIR}/plots" \
          "${ARTIFACT_DIR}/tensorboard" \
          "${ARTIFACT_DIR}/videos"

        # ── Train ──────────────────────────────────────────────────────────
        ./isaaclab.sh -p "scripts/reinforcement_learning/${RL_FRAMEWORK}/train.py" \
          --task "${TASK_NAME}" \
          --headless \
          --num_envs "${TRAIN_NUM_ENVS}" \
          --max_iterations "${MAX_ITERATIONS}"

        RUN_DIR="$(find "logs/${RL_FRAMEWORK}" -mindepth 2 -maxdepth 2 -type d -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${RUN_DIR}"
        RUN_PARENT="$(dirname "${RUN_DIR}")"

        CHECKPOINT="$(find "${RUN_DIR}" -type f -name '*.pt' -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${CHECKPOINT}"
        cp -v "${CHECKPOINT}" "${ARTIFACT_DIR}/checkpoints/"
        find "${RUN_DIR}" -type f -name 'events.out.tfevents*' -exec cp -v {} "${ARTIFACT_DIR}/tensorboard/" \;

        # ── Replay + record video (Module 4) ───────────────────────────────
        rm -rf "${RUN_DIR}/videos/play"
        ./isaaclab.sh -p "scripts/reinforcement_learning/${RL_FRAMEWORK}/play.py" \
          --task "${TASK_NAME}" \
          --headless \
          --num_envs "${PLAY_NUM_ENVS}" \
          --load_run "$(basename "${RUN_DIR}")" \
          --video \
          --video_length "${VIDEO_LENGTH}" || true

        RENDERED="$(
          { find "${RUN_DIR}/videos/play" -type f -name '*.mp4' -printf '%T@ %p\n' 2>/dev/null || true; } \
            | sort -n | tail -1 | cut -d' ' -f2-
        )"
        if [ -z "${RENDERED}" ]; then
          RENDERED="$(
            { find "${RUN_PARENT}" -type f -name '*.mp4' -printf '%T@ %p\n' 2>/dev/null || true; } \
              | sort -n | tail -1 | cut -d' ' -f2-
          )"
        fi
        if [ -n "${RENDERED}" ]; then
          cp -v "${RENDERED}" "${ARTIFACT_DIR}/videos/policy-rollout.mp4"
        fi

        # ── Export TensorBoard scalars + plots ─────────────────────────────
        export RUN_DIR ARTIFACT_DIR
        ./isaaclab.sh -p /tmp/export_tensorboard_scalars.py || true

        cat >"${ARTIFACT_DIR}/run-manifest.json" <<EOF
        {
          "rl_framework": "${RL_FRAMEWORK}",
          "task": "${TASK_NAME}",
          "train_num_envs": ${TRAIN_NUM_ENVS},
          "play_num_envs": ${PLAY_NUM_ENVS},
          "max_iterations": ${MAX_ITERATIONS},
          "video_length": ${VIDEO_LENGTH},
          "run_dir": "${RUN_DIR}",
          "checkpoint": "${CHECKPOINT}"
        }
        EOF

        find "${ARTIFACT_DIR}" -maxdepth 3 -type f | sort
    - path: /tmp/export_tensorboard_scalars.py
      contents: |
        import csv
        import json
        import os
        import re
        from pathlib import Path

        import matplotlib
        matplotlib.use("Agg")
        import matplotlib.pyplot as plt
        from tensorboard.backend.event_processing.event_accumulator import EventAccumulator

        run_dir = Path(os.environ["RUN_DIR"])
        artifact_dir = Path(os.environ["ARTIFACT_DIR"])
        tb_dir = artifact_dir / "tensorboard"
        plots_dir = artifact_dir / "plots"
        tb_dir.mkdir(parents=True, exist_ok=True)
        plots_dir.mkdir(parents=True, exist_ok=True)

        event_dirs = sorted({p.parent for p in run_dir.rglob("events.out.tfevents*")})
        if not event_dirs:
            raise SystemExit(f"no TensorBoard events under {run_dir}")

        series = {}
        for ed in event_dirs:
            acc = EventAccumulator(str(ed), size_guidance={"scalars": 0})
            acc.Reload()
            for tag in acc.Tags().get("scalars", []):
                series.setdefault(tag, []).extend((s.step, s.value) for s in acc.Scalars(tag))
        if not series:
            raise SystemExit("no scalar data in TensorBoard events")

        summary = {}
        for tag, values in sorted(series.items()):
            values = sorted(values)
            safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", tag).strip("_") or "scalar"
            with (tb_dir / f"{safe}.csv").open("w", newline="") as fh:
                w = csv.writer(fh)
                w.writerow(["step", "value"])
                w.writerows(values)
            summary[tag] = {
                "points": len(values),
                "first_step": values[0][0], "first_value": values[0][1],
                "last_step": values[-1][0], "last_value": values[-1][1],
            }

        def plot(fname, title, tags):
            tags = [t for t in tags if t in series]
            if not tags:
                return
            plt.figure(figsize=(10, 6))
            for tag in tags[:8]:
                vs = sorted(series[tag])
                plt.plot([s for s, _ in vs], [v for _, v in vs], label=tag)
            plt.xlabel("step"); plt.ylabel("scalar"); plt.title(title)
            plt.grid(True, alpha=0.3); plt.legend(fontsize=8); plt.tight_layout()
            plt.savefig(plots_dir / fname, dpi=160); plt.close()

        # Reward-ish tags differ across skrl/rsl_rl; plot whatever matches.
        reward_tags = [t for t in series if "reward" in t.lower() or "Reward" in t]
        plot("reward.png", "Episode Reward", reward_tags[:4])
        loss_tags = [t for t in series if "loss" in t.lower()]
        plot("loss.png", "Training Loss", loss_tags[:4])

        (artifact_dir / "metrics-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  isaac_lab_image: nvcr.io/nvidia/isaac-lab:2.2.0
  isaaclab_root: /workspace/IsaacLab
  rl_framework: skrl
  task_name: Isaac-Velocity-Rough-H1-v0
  train_num_envs: 2048
  play_num_envs: 32
  max_iterations: 1000
  video_length: 400
  output_dataset: e2e-pipeline-sim-rl-artifacts
