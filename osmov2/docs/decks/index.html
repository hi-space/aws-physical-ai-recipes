<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSMO on AWS — 교육 자료</title>
<style>
  :root {
    --bg: #0f1117; --card: #171a23; --ink: #e8eaf0; --dim: #9aa3b5;
    --accent: #ff9900; --accent2: #76b900; --line: #2a2f3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 32px;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  }
  main { width: 100%; max-width: 880px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  .sub { color: var(--dim); margin: 0 0 32px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--accent); border-radius: 10px; padding: 24px;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card.alt { border-left-color: var(--accent2); }
  a.card.alt:hover { border-color: var(--accent2); }
  .tag {
    display: inline-block; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; margin-bottom: 12px;
  }
  h2 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }
  footer { margin-top: 32px; color: var(--dim); font-size: 12px; line-height: 1.7; }
  kbd {
    background: #0b0d12; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; font-size: 11px; font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<main>
  <h1>NVIDIA OSMO on AWS</h1>
  <p class="sub">교육 자료 모음 · 슬라이드는 좌우 방향키로 이동합니다</p>

  <div class="grid">
    <a class="card" href="osmo-user-training.html">
      <span class="tag">사용자 관점</span>
      <h2>인프라 &amp; 파이프라인 사용자 교육</h2>
      <p>플랫폼 구조의 배경부터 워크플로 제출과 조회까지 다룹니다. 실습 중심으로 구성했습니다.</p>
    </a>

    <a class="card alt" href="osmo-infra-training.html">
      <span class="tag">운영자 관점</span>
      <h2>인프라 구축 &amp; 운영 교육</h2>
      <p>Terraform, Amazon EKS, Karpenter, 관측 구성까지 클러스터를 배포하고 운영하는 내용입니다.</p>
    </a>
  </div>

  <footer>
    슬라이드 단축키 — <kbd>←</kbd> <kbd>→</kbd> 이동, <kbd>Home</kbd> 처음, <kbd>End</kbd> 마지막. 브라우저 인쇄로 PDF 저장이 됩니다.
  </footer>
</main>
</body>
</html>
