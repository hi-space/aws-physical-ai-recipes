workflow:
  name: aws-isaacsim-livestream-51
  timeout:
    exec_timeout: 2h
    queue_timeout: 30m
  resources:
    sim:
      cpu: 4
      gpu: 1
      memory: 32Gi
      storage: 40Gi
      platform: g7e-rtx-pro-6000
  tasks:
  - name: stream
    resource: sim
    image: {{ isaac_sim_image }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail
        export ACCEPT_EULA=Y

        nvidia-smi

        cd /isaac-sim
        echo "Starting Isaac Sim 5.1.0 with livestreaming enabled..."
        ./runheadless.sh --/app/livestream/enabled=true

default-values:
  isaac_sim_image: nvcr.io/nvidia/isaac-sim:5.1.0
