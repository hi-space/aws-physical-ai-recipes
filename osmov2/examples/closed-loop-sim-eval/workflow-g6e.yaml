workflow:
  name: aws-closed-loop-sim-eval-g6e
  timeout:
    exec_timeout: 4h
    queue_timeout: 1h
  resources:
    gpu:
      cpu: 8
      gpu: 1
      memory: 90Gi
      storage: 200Gi
      platform: g6e-l40s

  tasks:
  - name: eval
    resource: gpu
    image: {{ isaac_lab_image }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    credentials:
      huggingface_token:
        HF_TOKEN: token
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail

        export ACCEPT_EULA=Y
        export PRIVACY_CONSENT=Y
        export DEBIAN_FRONTEND=noninteractive
        export HF_HOME=/tmp/hf-home
        export HUGGING_FACE_HUB_TOKEN="${HF_TOKEN:-}"
        export PYTHONUNBUFFERED=1

        ISAAC_GROOT_REPO="{{ isaac_groot_repository }}"
        ISAAC_GROOT_REF="{{ isaac_groot_ref }}"
        MODEL_PATH="{{ model_path }}"
        EMBODIMENT_TAG="{{ embodiment_tag }}"
        ENV_NAME="{{ env_name }}"
        N_EPISODES="{{ n_episodes }}"
        N_ACTION_STEPS="{{ n_action_steps }}"
        N_ENVS="{{ n_envs }}"
        MAX_EPISODE_STEPS="{{ max_episode_steps }}"
        POLICY_HOST="127.0.0.1"
        POLICY_PORT="{{ policy_port }}"
        ARTIFACT_DIR="{{output}}/artifacts"

        export MUJOCO_GL=egl
        export PYOPENGL_PLATFORM=egl

        nvidia-smi
        mkdir -p "${ARTIFACT_DIR}/logs" "${ARTIFACT_DIR}/videos"

        # Install system deps (libegl/libglu required by robosuite/MuJoCo EGL)
        apt-get update >/dev/null
        apt-get install -y --no-install-recommends \
          ca-certificates curl git git-lfs libgl1 libglib2.0-0 \
          libegl1-mesa-dev libglu1-mesa ffmpeg tmux >/dev/null
        git lfs install --skip-repo >/dev/null
        curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
        export PATH="${HOME}/.local/bin:${PATH}"

        # Clone Isaac-GR00T for the ZMQ inference server + rollout script
        git clone --recurse-submodules "${ISAAC_GROOT_REPO}" /tmp/Isaac-GR00T
        cd /tmp/Isaac-GR00T
        git checkout "${ISAAC_GROOT_REF}"
        git submodule update --init --recursive

        # Build the RoboCasa GR1 tabletop eval venv (robocasa_uv/.venv) and
        # download sim assets. This is the only supported way to get robocasa +
        # robosuite for rollout_policy.py; the workshop README runs it once.
        ROBOCASA_PY=/tmp/Isaac-GR00T/gr00t/eval/sim/robocasa-gr1-tabletop-tasks/robocasa_uv/.venv/bin/python
        bash gr00t/eval/sim/robocasa-gr1-tabletop-tasks/setup_RoboCasaGR1TabletopTasks.sh

        # Download model weights
        echo "Downloading model: ${MODEL_PATH}..."
        uv run --no-project --with huggingface_hub python -c "
        from huggingface_hub import snapshot_download
        snapshot_download('${MODEL_PATH}', local_dir='/tmp/model-weights')
        " || {
          echo "HF download failed, trying direct clone..."
          GIT_LFS_SKIP_SMUDGE=0 git clone "https://huggingface.co/${MODEL_PATH}" /tmp/model-weights
        }

        # transformers imports deepspeed whenever the package is importable, and
        # deepspeed's op-compat check shells out to nvcc — which the isaac-lab
        # image does not ship. GR00T inference needs none of deepspeed, so drop it
        # from the server venv; transformers then skips the import entirely.
        # deepspeed==0.17.6 is a locked gr00t dependency, so sync the venv first,
        # remove deepspeed, then run with --no-sync so uv does not reinstall it.
        uv sync
        uv pip uninstall deepspeed >/dev/null 2>&1 || true

        # Start GR00T inference server in background (main gr00t project venv
        # via `uv run`; GR1 robocasa eval needs the sim policy wrapper).
        echo "Starting GR00T inference server on port ${POLICY_PORT}..."
        uv run --no-sync python gr00t/eval/run_gr00t_server.py \
          --model_path /tmp/model-weights \
          --embodiment_tag "${EMBODIMENT_TAG}" \
          --use_sim_policy_wrapper \
          --host 0.0.0.0 \
          --port "${POLICY_PORT}" \
          > "${ARTIFACT_DIR}/logs/server.log" 2>&1 &
        SERVER_PID=$!

        # Wait for server to be ready (ping over ZMQ/msgpack)
        echo "Waiting for inference server..."
        for i in $(seq 1 180); do
          if "${ROBOCASA_PY}" -c "
        import zmq, msgpack
        ctx = zmq.Context()
        sock = ctx.socket(zmq.REQ)
        sock.setsockopt(zmq.RCVTIMEO, 2000)
        sock.connect('tcp://${POLICY_HOST}:${POLICY_PORT}')
        sock.send(msgpack.packb({'endpoint': 'ping', 'data': {}}))
        resp = msgpack.unpackb(sock.recv())
        print(f'Server ready: {resp}')
        " 2>/dev/null; then
            break
          fi
          if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
            echo "Server died. Log:"
            cat "${ARTIFACT_DIR}/logs/server.log"
            exit 1
          fi
          sleep 5
        done

        # Run closed-loop evaluation via rollout_policy.py (robocasa venv).
        # rollout_policy.py has no --record_dir; it writes videos to an internal
        # /tmp/sim_eval_videos_* dir, which we collect afterwards.
        echo "Starting closed-loop evaluation: ${ENV_NAME}, ${N_EPISODES} episodes..."
        "${ROBOCASA_PY}" gr00t/eval/rollout_policy.py \
          --policy_client_host "${POLICY_HOST}" \
          --policy_client_port "${POLICY_PORT}" \
          --env_name "${ENV_NAME}" \
          --n_episodes "${N_EPISODES}" \
          --n_action_steps "${N_ACTION_STEPS}" \
          --n_envs "${N_ENVS}" \
          --max_episode_steps="${MAX_EPISODE_STEPS}" \
          2>&1 | tee "${ARTIFACT_DIR}/logs/rollout.log" || true

        # Collect rollout videos from the script's internal output dir
        for d in /tmp/sim_eval_videos_*; do
          [ -d "$d" ] && cp -r "$d"/. "${ARTIFACT_DIR}/videos/" 2>/dev/null || true
        done

        # Collect results
        kill "${SERVER_PID}" 2>/dev/null || true
        wait "${SERVER_PID}" 2>/dev/null || true

        # Generate summary
        "${ROBOCASA_PY}" - "${ARTIFACT_DIR}" "${ENV_NAME}" "${N_EPISODES}" "${MODEL_PATH}" <<'PY'
        import json
        import sys
        from pathlib import Path

        artifact_dir = Path(sys.argv[1])
        env_name = sys.argv[2]
        n_episodes = int(sys.argv[3])
        model_path = sys.argv[4]

        rollout_log = (artifact_dir / "logs" / "rollout.log").read_text() if (artifact_dir / "logs" / "rollout.log").exists() else ""
        videos = sorted((artifact_dir / "videos").glob("*.mp4")) if (artifact_dir / "videos").exists() else []

        summary = {
            "env_name": env_name,
            "model_path": model_path,
            "n_episodes_requested": n_episodes,
            "n_videos_recorded": len(videos),
            "video_files": [v.name for v in videos],
        }

        success_count = rollout_log.count("success=True") + rollout_log.count("SUCCESS")
        fail_count = rollout_log.count("success=False") + rollout_log.count("FAIL")
        if success_count + fail_count > 0:
            summary["success_count"] = success_count
            summary["fail_count"] = fail_count
            summary["success_rate"] = success_count / (success_count + fail_count)

        (artifact_dir / "eval-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
        print(json.dumps(summary, indent=2))
        PY

        find "${ARTIFACT_DIR}" -maxdepth 3 -type f | sort
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  isaac_lab_image: nvcr.io/nvidia/isaac-lab:2.2.0
  isaac_groot_repository: "https://github.com/NVIDIA/Isaac-GR00T"
  isaac_groot_ref: "ead52833afbbf4243f8cd5e7664f48a94de03b19"
  model_path: nvidia/GR00T-N1.6-3B
  embodiment_tag: GR1
  env_name: "gr1_unified/PnPBottleToCabinetClose_GR1ArmsAndWaistFourierHands_Env"
  n_episodes: 1
  n_action_steps: 8
  n_envs: 1
  max_episode_steps: 720
  policy_port: 5555
  output_dataset: closed-loop-sim-eval-g6e-artifacts
