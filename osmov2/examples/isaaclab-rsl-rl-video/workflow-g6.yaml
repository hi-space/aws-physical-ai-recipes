workflow:
  name: aws-isaaclab-rsl-rl-video-g6
  timeout:
    exec_timeout: 8h
    queue_timeout: 1h
  resources:
    gpu_g7e:
      cpu: 4
      gpu: 1
      memory: 48Gi
      storage: 160Gi
      platform: g6-l4

  tasks:
  - name: train-and-render
    resource: gpu_g7e
    image: {{ isaac_lab_image }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail

        export ACCEPT_EULA=Y
        export PRIVACY_CONSENT=Y
        export MPLBACKEND=Agg

        ISAACLAB_ROOT="{{ isaaclab_root }}"
        TASK_NAME="{{ task_name }}"
        TRAIN_NUM_ENVS="{{ train_num_envs }}"
        PLAY_NUM_ENVS="{{ play_num_envs }}"
        MAX_ITERATIONS="{{ max_iterations }}"
        VIDEO_LENGTH="{{ video_length }}"
        ARTIFACT_DIR="{{output}}/artifacts"

        nvidia-smi
        if [ ! -x "${ISAACLAB_ROOT}/isaaclab.sh" ]; then
          for candidate in /workspace/IsaacLab /workspace/isaaclab /workspace/isaac-lab; do
            if [ -x "${candidate}/isaaclab.sh" ]; then
              ISAACLAB_ROOT="${candidate}"
              break
            fi
          done
        fi
        test -x "${ISAACLAB_ROOT}/isaaclab.sh"
        cd "${ISAACLAB_ROOT}"

        if ! command -v ffmpeg >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
        fi

        ./isaaclab.sh -i rsl_rl
        ./isaaclab.sh -p -m pip install --quiet tensorboard matplotlib pandas

        # Fix: bundled warp-lang in isaac-lab:2.2.0 fails on the node's CUDA 13
        # driver (Warp CUDA error 36 / cuDeviceGetUuid). NVIDIA/warp #851,#940
        # fixed the driver entry-point lookup; upgrade warp-lang in-container so
        # we do not touch the node driver / EKS AMI / GPU Operator.
        echo "warp-lang before upgrade:"
        ./isaaclab.sh -p -m pip show warp-lang 2>/dev/null | grep -i version || true
        ./isaaclab.sh -p -m pip install --quiet --upgrade "warp-lang=={{ warp_lang_version }}"
        echo "warp-lang after upgrade:"
        ./isaaclab.sh -p -m pip show warp-lang 2>/dev/null | grep -i version || true

        # Live metrics pusher: tails the TensorBoard events file train.py writes
        # and pushes each new step's scalars to the Pushgateway as they appear.
        cat >/tmp/metrics_pusher.py <<'PY'
        import os, re, time, glob, urllib.request
        from tensorboard.backend.event_processing.event_accumulator import EventAccumulator

        logs_root = os.environ["LOGS_ROOT"]
        pg = os.environ["PUSHGATEWAY_URL"].rstrip("/")
        job = os.environ.get("PUSH_JOB", "isaaclab_rsl_rl_live")
        task = os.environ.get("PUSH_TASK", "unknown")
        url = f"{pg}/metrics/job/{job}/task/{task}"

        def metric_name(tag):
            return "isaac_live_" + re.sub(r"[^A-Za-z0-9_]+", "_", tag).strip("_").lower()

        def push(step, scalars):
            lines = [f"# TYPE isaac_live_step gauge", f"isaac_live_step {step}"]
            for tag, val in scalars.items():
                m = metric_name(tag)
                lines.append(f"# TYPE {m} gauge")
                lines.append(f"{m} {val}")
            data = ("\n".join(lines) + "\n").encode()
            req = urllib.request.Request(url, data=data, method="POST")
            try:
                urllib.request.urlopen(req, timeout=10).read()
            except Exception as e:
                print(f"[pusher] push failed: {e}", flush=True)

        last_step = -1
        # Wait for the run's events file to appear, then stream new steps.
        while True:
            files = glob.glob(os.path.join(logs_root, "**", "events.out.tfevents*"), recursive=True)
            if not files:
                time.sleep(3); continue
            ev = max(files, key=os.path.getmtime)
            try:
                acc = EventAccumulator(os.path.dirname(ev), size_guidance={"scalars": 0})
                acc.Reload()
                tags = acc.Tags().get("scalars", [])
                # Build per-step snapshot for the newest steps only.
                steps = {}
                for tag in tags:
                    for s in acc.Scalars(tag):
                        steps.setdefault(s.step, {})[tag] = s.value
                for step in sorted(steps):
                    if step > last_step:
                        push(step, steps[step])
                        last_step = step
                        print(f"[pusher] pushed step {step} ({len(steps[step])} scalars)", flush=True)
                        time.sleep(1)  # spread pushes so Prometheus scrapes distinct points
            except Exception as e:
                print(f"[pusher] read error: {e}", flush=True)
            time.sleep(5)
        PY

        mkdir -p "${ARTIFACT_DIR}/checkpoints" \
          "${ARTIFACT_DIR}/plots" \
          "${ARTIFACT_DIR}/tensorboard" \
          "${ARTIFACT_DIR}/videos"

        # Real-time training metrics -> Pushgateway (method B). A background
        # poller tails the TensorBoard events file that train.py writes live and
        # pushes each new step's scalars to the Pushgateway, so Grafana shows the
        # learning curve as it happens (replaces watching TensorBoard locally).
        LOGS_ROOT="${ISAACLAB_ROOT}/logs/rsl_rl"
        mkdir -p "${LOGS_ROOT}"
        if [ -n "{{ pushgateway_url }}" ]; then
          PUSHGATEWAY_URL="{{ pushgateway_url }}" \
          PUSH_JOB="isaaclab_rsl_rl_live" \
          PUSH_TASK="${TASK_NAME}" \
          LOGS_ROOT="${LOGS_ROOT}" \
          ./isaaclab.sh -p /tmp/metrics_pusher.py &
          PUSHER_PID="$!"
          echo "started live metrics pusher pid=${PUSHER_PID}"
        fi

        ./isaaclab.sh -p scripts/reinforcement_learning/rsl_rl/train.py \
          --task "${TASK_NAME}" \
          --headless \
          --num_envs "${TRAIN_NUM_ENVS}" \
          --max_iterations "${MAX_ITERATIONS}"

        # Let the pusher flush the final steps, then stop it.
        if [ -n "${PUSHER_PID:-}" ]; then
          sleep 20
          kill "${PUSHER_PID}" >/dev/null 2>&1 || true
        fi

        RUN_DIR="$(find logs/rsl_rl -mindepth 2 -maxdepth 2 -type d -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${RUN_DIR}"
        RUN_PARENT="$(dirname "${RUN_DIR}")"
        CHECKPOINT_ZERO="$(find "${RUN_DIR}" -type f -name 'model_0.pt' -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${CHECKPOINT_ZERO}"
        CHECKPOINT="$(find "${RUN_DIR}" -type f -name 'model_*.pt' -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${CHECKPOINT}"

        cp -v "${CHECKPOINT}" "${ARTIFACT_DIR}/checkpoints/"
        find "${RUN_DIR}" -type f -name 'events.out.tfevents*' -exec cp -v {} "${ARTIFACT_DIR}/tensorboard/" \;

        # Video rendering (play.py --video) is DISABLED on g6/L4: Isaac Sim
        # offscreen camera rendering hangs on the node's CUDA 13 driver
        # (train.py physics completes fine; only play.py --video freezes).
        # We keep training, checkpoints, and TensorBoard metrics.
        echo "Skipping play.py video rendering on g6 (headless render hang)."
        VIDEO_COUNT=0

        export RUN_DIR
        export ARTIFACT_DIR
        cat >/tmp/export_tensorboard_scalars.py <<'PY'
        import csv
        import json
        import os
        import re
        from pathlib import Path

        import matplotlib

        matplotlib.use("Agg")
        import matplotlib.pyplot as plt
        from tensorboard.backend.event_processing.event_accumulator import EventAccumulator

        run_dir = Path(os.environ["RUN_DIR"])
        artifact_dir = Path(os.environ["ARTIFACT_DIR"])
        tensorboard_dir = artifact_dir / "tensorboard"
        plots_dir = artifact_dir / "plots"
        tensorboard_dir.mkdir(parents=True, exist_ok=True)
        plots_dir.mkdir(parents=True, exist_ok=True)

        event_dirs = sorted({path.parent for path in run_dir.rglob("events.out.tfevents*")})
        if not event_dirs:
            raise SystemExit(f"no TensorBoard event files found under {run_dir}")

        series = {}
        for event_dir in event_dirs:
            accumulator = EventAccumulator(str(event_dir), size_guidance={"scalars": 0})
            accumulator.Reload()
            for tag in accumulator.Tags().get("scalars", []):
                scalars = accumulator.Scalars(tag)
                if not scalars:
                    continue
                series.setdefault(tag, []).extend((item.step, item.value) for item in scalars)

        if not series:
            raise SystemExit("TensorBoard event files did not contain scalar data")

        summary = {}
        for tag, values in sorted(series.items()):
            values = sorted(values)
            safe_name = re.sub(r"[^A-Za-z0-9_.-]+", "_", tag).strip("_") or "scalar"
            csv_path = tensorboard_dir / f"{safe_name}.csv"
            with csv_path.open("w", newline="") as handle:
                writer = csv.writer(handle)
                writer.writerow(["step", "value"])
                writer.writerows(values)
            summary[tag] = {
                "points": len(values),
                "first_step": values[0][0],
                "first_value": values[0][1],
                "last_step": values[-1][0],
                "last_value": values[-1][1],
            }

        def plot_tags(path, title, tags):
            tags = [tag for tag in tags if tag in series]
            if not tags:
                return
            plt.figure(figsize=(10, 6))
            for tag in tags[:8]:
                values = sorted(series[tag])
                steps = [step for step, _ in values]
                scalars = [value for _, value in values]
                plt.plot(steps, scalars, label=tag)
            plt.xlabel("step")
            plt.ylabel("scalar")
            plt.title(title)
            plt.grid(True, alpha=0.3)
            plt.legend(fontsize=8)
            plt.tight_layout()
            plt.savefig(plots_dir / path, dpi=160)
            plt.close()

        plot_tags(
            "tracking-errors.png",
            "Isaac Lab RSL-RL End-Effector Tracking Errors",
            ["Metrics/ee_pose/position_error", "Metrics/ee_pose/orientation_error"],
        )
        plot_tags("value-loss.png", "Isaac Lab RSL-RL Value-Function Loss", ["Loss/value_function"])
        plot_tags("episode-length.png", "Isaac Lab RSL-RL Mean Episode Length", ["Train/mean_episode_length"])

        (artifact_dir / "metrics-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
        PY
        ./isaaclab.sh -p /tmp/export_tensorboard_scalars.py

        # Push final training scalars to the in-cluster Pushgateway so the
        # learning curves (reward, tracking error, loss) show up in the same
        # Grafana as DCGM GPU metrics. Best-effort: never fail the run on this.
        if [ -n "{{ pushgateway_url }}" ] && [ -f "${ARTIFACT_DIR}/metrics-summary.json" ]; then
          echo "Pushing training metrics to {{ pushgateway_url }}"
          PUSH_PAYLOAD="$(
            ./isaaclab.sh -p - "${ARTIFACT_DIR}/metrics-summary.json" <<'PY' || true
        import json, re, sys
        summary = json.load(open(sys.argv[1]))
        lines = []
        for tag, v in summary.items():
            metric = "isaac_" + re.sub(r"[^A-Za-z0-9_]+", "_", tag).strip("_").lower()
            last = v.get("last_value")
            if isinstance(last, (int, float)):
                lines.append(f"# TYPE {metric} gauge")
                lines.append(f"{metric} {last}")
        print("\n".join(lines))
        PY
          )"
          if [ -n "${PUSH_PAYLOAD}" ]; then
            printf '%s\n' "${PUSH_PAYLOAD}" | curl -fsS --max-time 20 --data-binary @- \
              "{{ pushgateway_url }}/metrics/job/isaaclab_rsl_rl/task/${TASK_NAME}" \
              && echo "training metrics pushed" || echo "WARN: pushgateway push failed (non-fatal)"
          fi
        fi

        cat >"${ARTIFACT_DIR}/run-manifest.json" <<EOF
        {
          "task": "${TASK_NAME}",
          "train_num_envs": ${TRAIN_NUM_ENVS},
          "play_num_envs": ${PLAY_NUM_ENVS},
          "max_iterations": ${MAX_ITERATIONS},
          "video_length": ${VIDEO_LENGTH},
          "run_dir": "${RUN_DIR}",
          "run_parent": "${RUN_PARENT}",
          "initial_checkpoint": "${CHECKPOINT_ZERO}",
          "checkpoint": "${CHECKPOINT}",
          "video_count": ${VIDEO_COUNT}
        }
        EOF

        find "${ARTIFACT_DIR}" -maxdepth 3 -type f | sort
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  isaac_lab_image: nvcr.io/nvidia/isaac-lab:2.2.0
  isaaclab_root: /workspace/IsaacLab
  task_name: Isaac-Reach-Franka-v0
  train_num_envs: 128
  play_num_envs: 16
  max_iterations: 200
  video_length: 200
  output_dataset: aws-isaaclab-rsl-rl-video-g6-artifacts
  warp_lang_version: "1.10.1"
  # In-cluster Pushgateway (deploy-observability-incluster.sh). Empty string
  # disables the push. Metrics appear in Grafana alongside DCGM GPU metrics.
  pushgateway_url: "http://aws-osmo-pushgateway-prometheus-pushgateway.monitoring.svc.cluster.local:9091"
