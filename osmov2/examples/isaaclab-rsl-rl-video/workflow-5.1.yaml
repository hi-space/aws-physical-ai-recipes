workflow:
  name: aws-isaaclab-rsl-rl-video-51
  timeout:
    exec_timeout: 8h
    queue_timeout: 1h
  resources:
    gpu_g7e:
      cpu: 4
      gpu: 1
      memory: 64Gi
      storage: 200Gi
      platform: g7e-rtx-pro-6000

  tasks:
  - name: train-and-render
    resource: gpu_g7e
    image: {{ isaac_lab_image }}
    command: ["bash", "-lc"]
    args:
    - bash /tmp/entry.sh
    files:
    - path: /tmp/entry.sh
      contents: |
        set -euo pipefail

        export ACCEPT_EULA=Y
        export PRIVACY_CONSENT=Y
        export MPLBACKEND=Agg

        ISAACLAB_ROOT="{{ isaaclab_root }}"
        TASK_NAME="{{ task_name }}"
        TRAIN_NUM_ENVS="{{ train_num_envs }}"
        PLAY_NUM_ENVS="{{ play_num_envs }}"
        MAX_ITERATIONS="{{ max_iterations }}"
        VIDEO_LENGTH="{{ video_length }}"
        ARTIFACT_DIR="{{output}}/artifacts"

        nvidia-smi
        if [ ! -x "${ISAACLAB_ROOT}/isaaclab.sh" ]; then
          for candidate in /workspace/IsaacLab /workspace/isaaclab /workspace/isaac-lab; do
            if [ -x "${candidate}/isaaclab.sh" ]; then
              ISAACLAB_ROOT="${candidate}"
              break
            fi
          done
        fi
        test -x "${ISAACLAB_ROOT}/isaaclab.sh"
        cd "${ISAACLAB_ROOT}"

        if ! command -v ffmpeg >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
        fi

        ./isaaclab.sh -i rsl_rl
        ./isaaclab.sh -p -m pip install --quiet tensorboard matplotlib pandas

        mkdir -p "${ARTIFACT_DIR}/checkpoints" \
          "${ARTIFACT_DIR}/plots" \
          "${ARTIFACT_DIR}/tensorboard" \
          "${ARTIFACT_DIR}/videos"

        ./isaaclab.sh -p scripts/reinforcement_learning/rsl_rl/train.py \
          --task "${TASK_NAME}" \
          --headless \
          --num_envs "${TRAIN_NUM_ENVS}" \
          --max_iterations "${MAX_ITERATIONS}"

        RUN_DIR="$(find logs/rsl_rl -mindepth 2 -maxdepth 2 -type d -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${RUN_DIR}"
        RUN_PARENT="$(dirname "${RUN_DIR}")"
        CHECKPOINT_ZERO="$(find "${RUN_DIR}" -type f -name 'model_0.pt' -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${CHECKPOINT_ZERO}"
        CHECKPOINT="$(find "${RUN_DIR}" -type f -name 'model_*.pt' -printf '%T@ %p\n' \
          | sort -n | tail -1 | cut -d' ' -f2-)"
        test -n "${CHECKPOINT}"

        cp -v "${CHECKPOINT}" "${ARTIFACT_DIR}/checkpoints/"
        find "${RUN_DIR}" -type f -name 'events.out.tfevents*' -exec cp -v {} "${ARTIFACT_DIR}/tensorboard/" \;

        render_video() {
          local checkpoint="$1"
          local output_name="$2"
          local rendered_video

          rm -rf "${RUN_DIR}/videos/play"
          ./isaaclab.sh -p scripts/reinforcement_learning/rsl_rl/play.py \
            --task "${TASK_NAME}" \
            --headless \
            --num_envs "${PLAY_NUM_ENVS}" \
            --load_run "$(basename "${RUN_DIR}")" \
            --checkpoint "${checkpoint}" \
            --video \
            --video_length "${VIDEO_LENGTH}"

          rendered_video="$(
            { find "${RUN_DIR}/videos/play" -type f -name '*.mp4' -printf '%T@ %p\n' 2>/dev/null || true; } \
              | sort -n | tail -1 | cut -d' ' -f2-
          )"
          if [ -z "${rendered_video}" ]; then
            rendered_video="$(
              { find "${RUN_PARENT}" -type f -name '*.mp4' -printf '%T@ %p\n' 2>/dev/null || true; } \
                | sort -n | tail -1 | cut -d' ' -f2-
            )"
          fi
          test -n "${rendered_video}"
          cp -v "${rendered_video}" "${ARTIFACT_DIR}/videos/${output_name}"
        }

        render_video "${CHECKPOINT_ZERO}" before-training.mp4
        render_video "${CHECKPOINT}" after-training.mp4
        VIDEO_COUNT=2

        export RUN_DIR
        export ARTIFACT_DIR
        cat >/tmp/export_tensorboard_scalars.py <<'PY'
        import csv
        import json
        import os
        import re
        from pathlib import Path

        import matplotlib

        matplotlib.use("Agg")
        import matplotlib.pyplot as plt
        from tensorboard.backend.event_processing.event_accumulator import EventAccumulator

        run_dir = Path(os.environ["RUN_DIR"])
        artifact_dir = Path(os.environ["ARTIFACT_DIR"])
        tensorboard_dir = artifact_dir / "tensorboard"
        plots_dir = artifact_dir / "plots"
        tensorboard_dir.mkdir(parents=True, exist_ok=True)
        plots_dir.mkdir(parents=True, exist_ok=True)

        event_dirs = sorted({path.parent for path in run_dir.rglob("events.out.tfevents*")})
        if not event_dirs:
            raise SystemExit(f"no TensorBoard event files found under {run_dir}")

        series = {}
        for event_dir in event_dirs:
            accumulator = EventAccumulator(str(event_dir), size_guidance={"scalars": 0})
            accumulator.Reload()
            for tag in accumulator.Tags().get("scalars", []):
                scalars = accumulator.Scalars(tag)
                if not scalars:
                    continue
                series.setdefault(tag, []).extend((item.step, item.value) for item in scalars)

        if not series:
            raise SystemExit("TensorBoard event files did not contain scalar data")

        summary = {}
        for tag, values in sorted(series.items()):
            values = sorted(values)
            safe_name = re.sub(r"[^A-Za-z0-9_.-]+", "_", tag).strip("_") or "scalar"
            csv_path = tensorboard_dir / f"{safe_name}.csv"
            with csv_path.open("w", newline="") as handle:
                writer = csv.writer(handle)
                writer.writerow(["step", "value"])
                writer.writerows(values)
            summary[tag] = {
                "points": len(values),
                "first_step": values[0][0],
                "first_value": values[0][1],
                "last_step": values[-1][0],
                "last_value": values[-1][1],
            }

        def plot_tags(path, title, tags):
            tags = [tag for tag in tags if tag in series]
            if not tags:
                return
            plt.figure(figsize=(10, 6))
            for tag in tags[:8]:
                values = sorted(series[tag])
                steps = [step for step, _ in values]
                scalars = [value for _, value in values]
                plt.plot(steps, scalars, label=tag)
            plt.xlabel("step")
            plt.ylabel("scalar")
            plt.title(title)
            plt.grid(True, alpha=0.3)
            plt.legend(fontsize=8)
            plt.tight_layout()
            plt.savefig(plots_dir / path, dpi=160)
            plt.close()

        plot_tags(
            "tracking-errors.png",
            "Isaac Lab RSL-RL End-Effector Tracking Errors",
            ["Metrics/ee_pose/position_error", "Metrics/ee_pose/orientation_error"],
        )
        plot_tags("value-loss.png", "Isaac Lab RSL-RL Value-Function Loss", ["Loss/value_function"])
        plot_tags("episode-length.png", "Isaac Lab RSL-RL Mean Episode Length", ["Train/mean_episode_length"])

        (artifact_dir / "metrics-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
        PY
        ./isaaclab.sh -p /tmp/export_tensorboard_scalars.py

        cat >"${ARTIFACT_DIR}/run-manifest.json" <<EOF
        {
          "task": "${TASK_NAME}",
          "train_num_envs": ${TRAIN_NUM_ENVS},
          "play_num_envs": ${PLAY_NUM_ENVS},
          "max_iterations": ${MAX_ITERATIONS},
          "video_length": ${VIDEO_LENGTH},
          "run_dir": "${RUN_DIR}",
          "run_parent": "${RUN_PARENT}",
          "initial_checkpoint": "${CHECKPOINT_ZERO}",
          "checkpoint": "${CHECKPOINT}",
          "video_count": ${VIDEO_COUNT}
        }
        EOF

        find "${ARTIFACT_DIR}" -maxdepth 3 -type f | sort
    outputs:
    - dataset:
        name: {{ output_dataset }}
        path: artifacts

default-values:
  isaac_lab_image: nvcr.io/nvidia/isaac-lab:2.3.0
  isaaclab_root: /workspace/IsaacLab
  task_name: Isaac-Reach-Franka-v0
  train_num_envs: 128
  play_num_envs: 16
  max_iterations: 200
  video_length: 200
  output_dataset: aws-isaaclab-rsl-rl-video-51-artifacts
