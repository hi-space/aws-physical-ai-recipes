# Isaac Lab RL 학습 Job (모듈 9 §9.7) — Slurm 경로의 slurm-templates/rl/finetune_isaaclab.sbatch 에 해당.
#
# - kueue.x-k8s.io/queue-name / priority-class 라벨로 task governance(Kueue) 큐에 들어간다.
#   라벨이 없으면 큐를 거치지 않고 바로 스케줄되어 콘솔 Dashboard 의 Tasks 에도 잡히지 않는다.
# - GPU 1장(nvidia.com/gpu: 1)을 요청하고 ml.g5.8xlarge 노드에만 배치한다.
#   sagemaker.amazonaws.com/node-health-status=Schedulable 로 헬스체크 통과 노드만 고른다.
# - 컨테이너는 nvcr.io/nvidia/isaac-lab (Isaac Sim 5.1 + Isaac Lab 2.3 + rsl_rl). 첫 실행 시 이미지 pull 이
#   약 10분 걸린다(~15 GB). 이후에는 노드 캐시를 쓴다.
# - 코드·체크포인트는 /fsx (fsx-pvc). train_isaaclab.py 는 /fsx/checkpoints/rl/<task>/<experiment>/ 에
#   model_<iter>.pt, model_best.pt 를 쓰고 FSx DRA 가 S3 checkpoints/ 로 내보낸다.
#
# 렌더: MAX_ITERATIONS=50 ./render.sh rl/isaaclab-train-job.yaml --apply
apiVersion: batch/v1
kind: Job
metadata:
  name: isaaclab-rl-${JOB_SUFFIX}
  namespace: ${NAMESPACE}
  labels:
    app: isaaclab-rl
    app: isaaclab-rl
    kueue.x-k8s.io/queue-name: ${QUEUE}
    kueue.x-k8s.io/priority-class: ${PRIORITY}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: isaaclab-rl
        # admission policy 는 Job 이 만드는 Pod 에도 같은 라벨을 요구한다.
        kueue.x-k8s.io/queue-name: ${QUEUE}
        kueue.x-k8s.io/priority-class: ${PRIORITY}
    spec:
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/instance-type: ml.g5.8xlarge
        sagemaker.amazonaws.com/node-health-status: Schedulable
      containers:
        - name: train
          image: nvcr.io/nvidia/isaac-lab:2.3.0
          imagePullPolicy: IfNotPresent
          command: ["/isaac-sim/python.sh"]
          args:
            - /fsx/scratch/aws-physical-ai-recipes/hyperpod-training/examples/rl/train_isaaclab.py
            - --task
            - "${TASK}"
            - --num_envs
            - "${NUM_ENVS}"
            - --max_iterations
            - "${MAX_ITERATIONS}"
            - --log_dir
            - /fsx/checkpoints/rl
            - --headless
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: PRIVACY_CONSENT
              value: "Y"
            - name: OMNI_KIT_ACCEPT_EULA
              value: "YES"
            - name: OMNI_KIT_ALLOW_ROOT
              value: "1"
            - name: PYTHONPATH
              value: /fsx/scratch/isaaclab-workshop/src
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GIT_PYTHON_REFRESH
              value: quiet
            # SageMaker 관리형 MLflow 를 쓰려면 tracking server ARN 을 넣는다 (비우면 비활성).
            - name: MLFLOW_TRACKING_URI
              value: ""
            - name: MLFLOW_EXPERIMENT_NAME
              value: isaaclab-rl
          resources:
            requests:
              cpu: "12"
              memory: 48Gi
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
