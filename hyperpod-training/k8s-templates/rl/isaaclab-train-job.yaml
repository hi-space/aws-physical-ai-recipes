# Isaac Lab RL 학습 Job (모듈 9B, 모듈 11). Slurm 경로의 slurm-templates/rl/finetune_isaaclab.sbatch 에 해당.
#
# - 팀 네임스페이스(NAMESPACE=hyperpod-ns-*)에서는 kueue.x-k8s.io/queue-name / priority-class 라벨로 task governance(Kueue)
#   큐에 들어간다. 일반 네임스페이스(rl)에서는 render.sh 가 라벨 줄을 제거해 큐를 거치지 않고 바로 스케줄된다.
# - GPU 1장(nvidia.com/gpu: 1)을 요청하고 ml.g5.8xlarge 노드에만 배치한다.
#   sagemaker.amazonaws.com/node-health-status=Schedulable 로 헬스체크 통과 노드만 고른다.
# - 컨테이너는 nvcr.io/nvidia/isaac-lab (Isaac Sim 5.1 + Isaac Lab 2.3 + rsl_rl). 첫 실행 시 이미지 pull 이
#   약 3분 걸린다(8.5 GB). 이후에는 노드 캐시를 쓴다(노드를 내리면 캐시도 사라진다).
# - 코드·체크포인트는 /fsx (fsx-pvc). train_isaaclab.py 는 /fsx/checkpoints/rl/<task>/<experiment>/ 에
#   model_<iter>.pt, model_best.pt 를 쓰고 FSx DRA 가 S3 checkpoints/ 로 내보낸다.
#
# 렌더: MAX_ITERATIONS=50 ./render.sh rl/isaaclab-train-job.yaml --apply
apiVersion: batch/v1
kind: Job
metadata:
  name: isaaclab-rl-${JOB_SUFFIX}
  namespace: ${NAMESPACE}
  labels:
    app: isaaclab-rl
    kueue.x-k8s.io/queue-name: ${QUEUE}
    kueue.x-k8s.io/priority-class: ${PRIORITY}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: isaaclab-rl
        # admission policy 는 Job 이 만드는 Pod 에도 같은 라벨을 요구한다.
        kueue.x-k8s.io/queue-name: ${QUEUE}
        kueue.x-k8s.io/priority-class: ${PRIORITY}
    spec:
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/instance-type: ml.g5.8xlarge
        sagemaker.amazonaws.com/node-health-status: Schedulable
      containers:
        - name: train
          image: nvcr.io/nvidia/isaac-lab:2.3.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ceu"]
          args:
            - |
              # MLFLOW_TRACKING_URI 가 채워져 있으면 추적 패키지를 먼저 설치한다. isaac-lab 이미지에는
              # isaaclab / isaaclab_rl / rsl_rl 만 있고 mlflow 는 없다. 전체 mlflow 대신 mlflow-skinny 를
              # 쓰는 이유는 전체 패키지가 numpy/pandas 를 끌어올려 Isaac Sim 의 numpy 1.26 빌드를 깨기 때문이다.
              if [ -n "${MLFLOW_TRACKING_URI:-}" ]; then
                /isaac-sim/python.sh -c 'import mlflow, sagemaker_mlflow' 2>/dev/null ||
                  /isaac-sim/python.sh -m pip install --no-cache-dir -q mlflow-skinny sagemaker-mlflow
              fi
              exec /isaac-sim/python.sh \
                /fsx/scratch/aws-physical-ai-recipes/hyperpod-training/examples/rl/train_isaaclab.py \
                --task "${TASK}" \
                --num_envs "${NUM_ENVS}" \
                --max_iterations "${MAX_ITERATIONS}" \
                --log_dir /fsx/checkpoints/rl \
                --headless
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: PRIVACY_CONSENT
              value: "Y"
            - name: OMNI_KIT_ACCEPT_EULA
              value: "YES"
            - name: OMNI_KIT_ALLOW_ROOT
              value: "1"
            - name: PYTHONPATH
              value: /fsx/scratch/isaaclab-workshop/src
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GIT_PYTHON_REFRESH
              value: quiet
            # SageMaker 관리형 MLflow 의 tracking server ARN. render.sh 가 HyperPodEks 스택의
            # MlflowTrackingUri Output 에서 읽어 채우고, Output 이 없으면(enableMlflow=false)
            # 빈 값으로 남아 MLflow 추적이 비활성화된다.
            - name: MLFLOW_TRACKING_URI
              value: "${MLFLOW_TRACKING_URI}"
            - name: MLFLOW_EXPERIMENT_NAME
              value: isaaclab-rl
          resources:
            requests:
              cpu: "12"
              memory: 48Gi
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: fsx
              mountPath: /fsx
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
