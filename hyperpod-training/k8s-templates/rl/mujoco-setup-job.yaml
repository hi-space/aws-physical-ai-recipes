# 최초 1회: MuJoCo(CPU) RL venv 를 /fsx/envs/mujoco 에 만든다 (모듈 9B 의 setup_mujoco_env.sh 를 컨테이너에서 실행).
# workshop-setup-job 이 먼저 끝나 /fsx/scratch/aws-physical-ai-recipes 가 있어야 한다.
# venv 는 이 이미지의 python 3.11 에 묶이므로 mujoco-train-job.yaml 과 같은 이미지를 쓴다.
# 렌더: NAMESPACE=hyperpod-ns-team-b ./render.sh rl/mujoco-setup-job.yaml --apply
apiVersion: batch/v1
kind: Job
metadata:
  name: mujoco-setup-${JOB_SUFFIX}
  namespace: ${NAMESPACE}
  labels:
    app: mujoco-setup
    # task governance 의 admission policy 가 모든 Job 에 queue-name 라벨을 요구한다 (라벨 없는 Job 은 거부됨).
    kueue.x-k8s.io/queue-name: ${QUEUE}
    kueue.x-k8s.io/priority-class: ${PRIORITY}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: mujoco-setup
        # admission policy 는 Job 이 만드는 Pod 에도 같은 라벨을 요구한다.
        kueue.x-k8s.io/queue-name: ${QUEUE}
        kueue.x-k8s.io/priority-class: ${PRIORITY}
    spec:
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/instance-type: ml.c5.4xlarge
      containers:
        - name: setup
          image: public.ecr.aws/docker/library/python:3.11
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ceu"]
          args:
            - |
              bash /fsx/scratch/aws-physical-ai-recipes/hyperpod-training/scripts/setup_mujoco_env.sh
          volumeMounts:
            - name: fsx
              mountPath: /fsx
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: fsx
          persistentVolumeClaim:
            claimName: fsx-pvc
