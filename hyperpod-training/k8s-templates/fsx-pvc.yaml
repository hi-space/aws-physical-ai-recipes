# FSx for Lustre 를 팀 네임스페이스에 붙이는 PV + PVC (정적 프로비저닝).
# 정적 PV 는 PVC 하나에만 바인딩되므로 네임스페이스마다 한 쌍을 만든다. 모두 같은 파일시스템(/fsx)을 가리킨다.
# 렌더: ./render.sh fsx-pvc.yaml --apply   (FSX_* 는 HyperPodEks 스택 Output 에서 채워진다)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fsx-pv-${NAMESPACE}
spec:
  capacity:
    storage: ${FSX_GIB}Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fsx-sc
  mountOptions:
    - flock
  csi:
    driver: fsx.csi.aws.com
    volumeHandle: ${FSX_ID}
    volumeAttributes:
      dnsname: ${FSX_DNS}
      mountname: ${FSX_MOUNT}
  claimRef:
    namespace: ${NAMESPACE}
    name: fsx-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fsx-pvc
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fsx-sc
  volumeName: fsx-pv-${NAMESPACE}
  resources:
    requests:
      storage: ${FSX_GIB}Gi
