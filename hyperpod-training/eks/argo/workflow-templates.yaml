# -----------------------------------------------------------------------------
# vla-openloop-eval — 2단 평가의 1단. 체크포인트를 녹화 궤적과 비교해 MSE 만 낸다.
#
#   시뮬레이터는 필요 없지만 GPU 는 필요하다. eval_closed_loop.py 가 정책을
#   cuda:0 에 올리기 때문이다. 그래서 CPU 템플릿이 아니라 g5.8xlarge 를 쓴다.
#
#   결과는 FSx 의 eval_results.json 과 MLflow(vla-eval 실험) 양쪽으로 나간다.
#   MLflow 쪽이 Grafana "Training Console" 의 Open-loop eval 패널 3종이 읽는 곳이다.
#   MLflow 가 없으면 로깅만 조용히 생략되고 평가는 그대로 끝난다.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vla-openloop-eval
  namespace: ${ARGO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: hyperpod-job-portal
  annotations:
    workflows.argoproj.io/title: "GR00T open-loop eval (GPU)"
    workflows.argoproj.io/description: >-
      Submits k8s-templates/rl/openloop-eval-job.yaml. Scores a GR00T checkpoint
      against recorded LeRobot trajectories (action MSE) on one ml.g5.8xlarge,
      roughly four minutes for twelve episodes. Results land in MLflow experiment
      vla-eval and show up on the Grafana training console. Open-loop MSE measures
      behaviour-cloning fidelity, not task success - use it as a first filter
      before closed-loop rollout, not as the promotion gate.
spec:
  entrypoint: main
  serviceAccountName: ${WORKFLOW_SA}
  ttlStrategy:
    secondsAfterCompletion: 604800
  arguments:
    parameters:
      - name: namespace
        value: rl
      - name: checkpoint
        value: latest
        description: >-
          GR00T checkpoint directory to score, or latest to pick the most recent
          one under /fsx/checkpoints/vla. A fixed default cannot work: with
          tracking on the fine-tune writes to the MLflow run's own artifact path
          and that run id does not exist at render time. To score a specific
          version, pass the fsx_dir tag from the MLflow Model Registry.
      - name: dataset-path
        value: /fsx/datasets/groot/so101-place-orange
        description: "LeRobot dataset holding the reference trajectories"
      - name: num-episodes
        value: "12"
        description: "Episodes to score (capped by what the dataset holds)"
      - name: priority
        value: training-priority
        enum:
          - training-priority
          - inference-priority
          - background-priority
  templates:
    - name: main
      steps:
        - - name: render
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: rl/openloop-eval-job.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
                    CHECKPOINT={{workflow.parameters.checkpoint}}
                    DATASET_PATH={{workflow.parameters.dataset-path}}
                    NUM_EPISODES={{workflow.parameters.num-episodes}}
        - - name: submit
            templateRef:
              name: isaaclab-train
              template: submit
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render.outputs.result}}"
---
# -----------------------------------------------------------------------------
# vla-eval-gate — 평가 숫자를 승격/차단 결정으로 바꿔 개발 루프를 닫는다.
#
#   무엇이 없었나
#     vla-openloop-eval 은 MSE 를 파일과 MLflow 에 쓴다. 그 숫자를 읽고 무언가를
#     멈추는 주체가 없었으므로, 0% 로 평가된 체크포인트와 100% 가 파이프라인에서
#     구분되지 않았다. 제어 루프는 닫혀 있었고(policy_server 가 30Hz 로 행동을
#     돌려준다) 개발 루프는 열려 있었다.
#
#   무엇이 닫는가
#     gate_checkpoint.py 가 BLOCK 이면 0 이 아닌 값으로 끝난다. Job 은
#     backoffLimit 0 이므로 즉시 failed 가 되고, submit 단계가 status.failed 를
#     보고 1 로 끝내므로 워크플로가 실패한다. Slurm 경로의 --dependency=afterok 와
#     같은 역할이다. 배포를 이 뒤에 매달면 BLOCK 에서 멈춘다.
#
#   지표에 따라 할 수 있는 일이 다르다
#     gate-input=openloop  action MSE 다. 행동 복제 충실도이지 태스크 성공률이
#                          아니므로 차단만 할 수 있다. 통과하면 PROMOTE 가 아니라
#                          PASS 이고 alias 도 건드리지 않는다. 비싼 closed-loop
#                          롤아웃 앞에 두는 싼 1차 필터다.
#     gate-input=trials    실로봇 per-trial JSONL 의 태스크 성공률이다. 승격할 수
#                          있다. 이때만 promote-alias 가 동작한다.
#     gate-input=rollout   leisaac 롤아웃 로그의 "[N/M]". 성공률이므로 승격 가능.
#
#   with-eval 를 끄면 평가를 건너뛰고 이미 있는 산출물만 채점한다. 실로봇 기록을
#   채점할 때는 평가 Job 을 돌릴 이유가 없고, GPU 를 잡을 이유도 없다.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vla-eval-gate
  namespace: ${ARGO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: hyperpod-job-portal
  annotations:
    workflows.argoproj.io/title: "VLA eval gate - promote or block a checkpoint (CPU)"
    workflows.argoproj.io/description: >-
      Turns eval numbers into a promote/block decision and makes that decision
      load-bearing. Optionally runs openloop-eval first, then submits
      k8s-templates/rl/eval-gate-job.yaml, which aggregates the results and exits
      non-zero on BLOCK. Chain a deploy step behind this workflow and a blocked
      checkpoint never reaches it. The gate itself needs no GPU. Two metrics, two
      powers - open-loop MSE can only block, because it measures behaviour-cloning
      fidelity rather than task success; a real-robot or closed-loop success rate
      can promote, and only then will promote-alias move a Model Registry alias.
spec:
  entrypoint: main
  serviceAccountName: ${WORKFLOW_SA}
  ttlStrategy:
    secondsAfterCompletion: 604800
  arguments:
    parameters:
      - name: namespace
        value: rl
        description: "Target namespace. hyperpod-ns-* routes the Job through the task governance queue."
      - name: gate-input
        value: openloop
        enum:
          - openloop
          - trials
          - rollout
        description: >-
          Which eval artifact to gate on. openloop reads eval_results.json
          (action MSE) and can only block. trials reads per-trial JSONL and
          rollout parses a leisaac log; both measure task success and can promote.
      - name: with-eval
        value: "true"
        enum:
          - "true"
          - "false"
        description: >-
          Run an open-loop eval before gating. Set false to gate an artifact that
          already exists - required when gate-input is trials, since real-robot
          records come from hardware, not from a Job.
      - name: gate-source
        value: latest
        description: >-
          Path on /fsx to the artifact being gated. latest works only for
          openloop and picks the most recent eval_results.json under
          /fsx/checkpoints/rl. trials and rollout need an explicit path.
      - name: max-mse
        value: "500"
        description: >-
          gate-input=openloop: block when mean action MSE exceeds this. 500 comes
          from what this cluster actually produced - seven open-loop evals in
          2026-10-21..23 ranged 335 to 701, with the most-trained checkpoint
          lowest. MSE scales with action normalisation, so this is not a
          universal constant; re-fit it after a few evals on a new task. A
          ceiling that blocks everything teaches people to ignore the gate.
      - name: threshold
        value: "0.5"
        description: "gate-input=trials/rollout: block when success rate is below this"
      - name: require-distinguishable
        value: "false"
        enum:
          - "false"
          - "true"
        description: >-
          Block when the margin over the runner-up is within noise. The
          2026-10-22 real-robot run read 17% vs 12% at n=24, which needs ~1123
          trials per arm to separate - without this, a one-trial difference
          picks a winner.
      - name: max-systematic-failures
        value: ""
        description: >-
          Block when more than N parts fail every single attempt on every
          checkpoint. A shared total failure implicates the part geometry or
          grasp pose, not the model, so it must not be absorbed into a model
          score. Empty disables the condition.
      - name: promote-alias
        value: ""
        description: >-
          On PROMOTE, move this Model Registry alias onto the matching version
          (for example champion). The version is found by the fsx_dir tag that
          register_groot_model.py writes. Empty leaves promotion to a human,
          which is the default register_groot_model.py assumes.
      - name: model-name
        value: ""
        description: >-
          Registered model name that promote-alias acts on. Empty falls back to
          groot-<dataset>, the name groot-finetune-job passes to
          register_groot_model.py. Set it explicitly when the dataset differs
          from the default, otherwise the alias is looked up on the wrong model.
      - name: checkpoint
        value: latest
        description: >-
          Checkpoint directory. Used for the eval step and, when promote-alias
          is set, as the fsx_dir value that selects the model version. latest
          skips that join, so pass an explicit path to promote an alias.
      - name: dataset-path
        value: /fsx/datasets/groot/so101-place-orange
        description: "LeRobot dataset for the eval step. Ignored when with-eval is false."
      - name: num-episodes
        value: "12"
        description: "Episodes for the eval step. Ignored when with-eval is false."
      - name: priority
        value: training-priority
        enum:
          - training-priority
          - inference-priority
          - background-priority
        description: "WorkloadPriorityClass. Only used in team namespaces."
  templates:
    - name: main
      steps:
        # 평가는 선택이다. 실로봇 기록을 채점할 때는 돌릴 이유가 없으므로
        # when 으로 건너뛴다. 건너뛰어도 뒤의 게이트 단계는 그대로 실행된다.
        - - name: render-eval
            when: "{{workflow.parameters.with-eval}} == true"
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: rl/openloop-eval-job.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
                    CHECKPOINT={{workflow.parameters.checkpoint}}
                    DATASET_PATH={{workflow.parameters.dataset-path}}
                    NUM_EPISODES={{workflow.parameters.num-episodes}}
        - - name: submit-eval
            when: "{{workflow.parameters.with-eval}} == true"
            templateRef:
              name: isaaclab-train
              template: submit
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render-eval.outputs.result}}"
        # 평가가 실패하면 여기까지 오지 않는다. 그게 의도다 — 평가가 안 끝난
        # 체크포인트에 대해 게이트가 낼 수 있는 정직한 결정은 없다.
        - - name: render-gate
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: rl/eval-gate-job.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
                    GATE_INPUT={{workflow.parameters.gate-input}}
                    GATE_SOURCE={{workflow.parameters.gate-source}}
                    MAX_MSE={{workflow.parameters.max-mse}}
                    THRESHOLD={{workflow.parameters.threshold}}
                    REQUIRE_DISTINGUISHABLE={{workflow.parameters.require-distinguishable}}
                    MAX_SYSTEMATIC_FAILURES={{workflow.parameters.max-systematic-failures}}
                    PROMOTE_ALIAS={{workflow.parameters.promote-alias}}
                    CHECKPOINT={{workflow.parameters.checkpoint}}
                    MODEL_NAME={{workflow.parameters.model-name}}
                    DATASET_PATH={{workflow.parameters.dataset-path}}
        - - name: submit-gate
            templateRef:
              name: isaaclab-train
              template: submit
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render-gate.outputs.result}}"
---
# -----------------------------------------------------------------------------
# vla-groot-setup — VLA 경로의 최초 1회 준비. workshop-setup 과 별개로 두는 이유는
#   세 가지다. (1) GPU 를 쓴다 — 마지막 검증이 `import gr00t, torch` 로 CUDA 런타임까지
#   확인하므로 CPU 노드로는 돌지 않는다. (2) 25~40분 걸린다. (3) RL 경로만 할 참가자는
#   필요하지 않다. workshop-setup 이 먼저 끝나 /fsx 에 코드가 있어야 한다.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vla-groot-setup
  namespace: ${ARGO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: hyperpod-job-portal
  annotations:
    workflows.argoproj.io/title: "One-time VLA prep - GR00T venv, repo, SO-101 dataset"
    workflows.argoproj.io/description: >-
      Submits k8s-templates/setup/groot-setup-job.yaml. Builds /fsx/envs/gr00t,
      checks out Isaac-GR00T at the pinned release tag, and downloads the SO-101
      LeRobot dataset with its modality.json. Takes 25-40 minutes on one
      ml.g5.8xlarge and is idempotent, so a re-run after a network failure is
      cheap. Run workshop-setup first - this needs the recipes checkout on /fsx.
      N1.7 is a gated model and additionally needs a hf-token Secret.
spec:
  entrypoint: main
  serviceAccountName: ${WORKFLOW_SA}
  ttlStrategy:
    secondsAfterCompletion: 604800
  arguments:
    parameters:
      - name: namespace
        value: rl
      - name: groot-version
        value: n1.6
        description: "n1.6 is open; n1.7 is gated and needs a hf-token Secret"
        enum:
          - n1.6
          - n1.7
      - name: dataset
        value: so101-place-orange
        description: "Directory name under /fsx/datasets/groot"
      - name: priority
        value: training-priority
        enum:
          - training-priority
          - inference-priority
          - background-priority
  templates:
    - name: main
      steps:
        - - name: render
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: setup/groot-setup-job.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
                    GROOT_VERSION={{workflow.parameters.groot-version}}
                    DATASET={{workflow.parameters.dataset}}
        - - name: submit
            templateRef:
              name: isaaclab-train
              template: submit
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render.outputs.result}}"
---
# -----------------------------------------------------------------------------
# vla-groot-finetune — SO-101 데이터셋으로 GR00T 를 파인튜닝한다. 산출물은
#   /fsx/checkpoints/vla/groot-<dataset>/checkpoint-<step> 이고, 이 경로가
#   vla-openloop-eval 의 checkpoint 기본값이다. 두 템플릿을 순서대로 제출하면
#   학습 → 평가 → Grafana 패널까지 이어진다.
#
#   batch-size 를 올리지 말 것. 3B 모델이 A10G 24 GB 에 들어가는 건 패치가 켜는
#   gradient checkpointing 과 paged 8-bit optimizer 덕분이고 여유분이 거의 없다.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: vla-groot-finetune
  namespace: ${ARGO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: hyperpod-job-portal
  annotations:
    workflows.argoproj.io/title: "GR00T fine-tune (GPU)"
    workflows.argoproj.io/description: >-
      Submits k8s-templates/rl/groot-finetune-job.yaml. Fine-tunes GR00T on the
      SO-101 dataset on one ml.g5.8xlarge - roughly forty minutes for 2000 steps.
      Writes checkpoint-<step> directories under /fsx/checkpoints/vla, which is
      exactly what vla-openloop-eval reads, so submit that next to score the
      result. Run vla-groot-setup first. Raising batch-size will OOM: the 3B
      model only fits in 24 GB thanks to gradient checkpointing and a paged
      8-bit optimizer.
spec:
  entrypoint: main
  serviceAccountName: ${WORKFLOW_SA}
  ttlStrategy:
    secondsAfterCompletion: 604800
  arguments:
    parameters:
      - name: namespace
        value: rl
      - name: groot-version
        value: n1.6
        description: "Must match what vla-groot-setup built"
        enum:
          - n1.6
          - n1.7
      - name: dataset
        value: so101-place-orange
        description: "Directory name under /fsx/datasets/groot"
      - name: max-steps
        value: "2000"
        description: "Training steps. 2000 is about forty minutes on one A10G"
      - name: global-batch-size
        value: "32"
        description: "Leave at 32 - larger values run out of VRAM on A10G"
      - name: priority
        value: training-priority
        enum:
          - training-priority
          - inference-priority
          - background-priority
  templates:
    - name: main
      steps:
        - - name: render
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: rl/groot-finetune-job.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
                    GROOT_VERSION={{workflow.parameters.groot-version}}
                    DATASET={{workflow.parameters.dataset}}
                    MAX_STEPS={{workflow.parameters.max-steps}}
                    GLOBAL_BATCH_SIZE={{workflow.parameters.global-batch-size}}
        - - name: submit
            templateRef:
              name: isaaclab-train
              template: submit
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render.outputs.result}}"
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: workshop-setup
  namespace: ${ARGO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: hyperpod-job-portal
  annotations:
    workflows.argoproj.io/title: "One-time prep - FSx claim, code clone, MuJoCo venv"
    workflows.argoproj.io/description: >-
      Applies fsx-pvc.yaml then submits setup/workshop-setup-job.yaml and
      rl/mujoco-setup-job.yaml in order. Clones the recipes into /fsx and builds
      /fsx/envs/mujoco. Run once per namespace. Takes about ten minutes.
spec:
  entrypoint: main
  serviceAccountName: ${WORKFLOW_SA}
  ttlStrategy:
    secondsAfterCompletion: 604800
  arguments:
    parameters:
      - name: namespace
        value: rl
      - name: recipes-ref
        value: feat/e2e-workshop
        description: "Branch to clone"
      - name: priority
        value: training-priority
        enum:
          - training-priority
          - inference-priority
          - background-priority
  templates:
    # fsx-pvc 가 없으면 Job 이 영원히 Pending 이므로 제일 먼저 만든다.
    # render.sh 가 FSX_* 를 HyperPodEks 스택 Output 에서 읽으므로 render 단계에
    # AWS 호출 권한이 필요하다 (install-job-portal.sh 가 pod identity 를 붙인다).
    - name: main
      steps:
        - - name: render-pvc
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: fsx-pvc.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
        - - name: apply-pvc
            template: apply
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render-pvc.outputs.result}}"
        - - name: render-clone
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: setup/workshop-setup-job.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
                    RECIPES_REF={{workflow.parameters.recipes-ref}}
        - - name: clone
            templateRef:
              name: isaaclab-train
              template: submit
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render-clone.outputs.result}}"
        - - name: render-venv
            templateRef:
              name: isaaclab-train
              template: render
            arguments:
              parameters:
                - name: template
                  value: rl/mujoco-setup-job.yaml
                - name: env
                  value: |
                    NAMESPACE={{workflow.parameters.namespace}}
                    PRIORITY={{workflow.parameters.priority}}
        - - name: venv
            templateRef:
              name: isaaclab-train
              template: submit
            arguments:
              parameters:
                - name: manifest
                  value: "{{steps.render-venv.outputs.result}}"

    # fsx-pvc.yaml 은 PV + PVC 두 개를 담고 있고 이미 있으면 create 가 실패한다.
    # resource 템플릿은 리소스 하나만 다루므로 kubectl apply 를 직접 쓴다.
    - name: apply
      inputs:
        parameters:
          - name: manifest
      script:
        image: ${RENDER_IMAGE}
        command: [sh, -ceu]
        source: |
          apk add --no-cache kubectl >/dev/null 2>&1
          cat >/tmp/manifest.yaml <<'MANIFESTEOF'
          {{inputs.parameters.manifest}}
          MANIFESTEOF
          kubectl apply -f /tmp/manifest.yaml
